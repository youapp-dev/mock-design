.apreceive-result.is-new { animation:apResultIn 380ms 570ms both }
.apreceive-art.is-opening .ap-envelope-art { animation:apPacketLift 610ms ease-out both }
.apreceive-art.is-opening .ap-envelope-flap { animation:apFlapRelease 390ms 105ms ease-in both }
.apreceive-art.is-opening .ap-envelope-open-lid { animation:apLidLift 330ms 190ms ease-out both }
.apreceive-art.is-opening .ap-envelope-light, .apreceive-art.is-opening .ap-envelope-rim { animation:apLightOn 285ms 225ms ease-out both }
.apreceive-art.is-opening .ap-envelope-seal { animation:apSealRelease 520ms ease-out both }
.apreceive-art.is-open .ap-envelope-flap { opacity:0 }
.apreceive-art.is-open .ap-envelope-seal { transform:translate(-50%,-42%) scale(.93) }
.apreceive-art.is-open .ap-envelope-open-lid, .apreceive-art.is-open .ap-envelope-light, .apreceive-art.is-open .ap-envelope-rim { opacity:1; transform:none }
.apreceive-art.is-open .ap-envelope-art { transform:translateY(-5px) rotate(-3deg) }
.apreceive-art.is-celebrating .ap-envelope-rays { animation:apBurstGlow 1780ms ease-out both }
.ap-burst-piece {
  position:absolute; z-index:2; top:36%; left:50%; display:grid; place-items:center; opacity:0;
  animation:apMoneyBurst 1430ms ease-out var(--delay,0ms) both;

.ap-burst-note { width:calc(28px * var(--size,1)); aspect-ratio:5/8; border:2px solid #ffd1a2; border-radius:5px 7px 4px 8px; background:linear-gradient(160deg,#ff967e,#ed676b); box-shadow:inset 0 0 0 2px #ffc2a494 }
.ap-burst-note::before { content:''; width:47%; aspect-ratio:1; border-radius:50%; background:#ffbba4 }
.ap-burst-star { width:15px; background:#f6bb46 }
.ap-burst-ribbon { width:7px; height:17px; border-radius:3px; background:#ad77dd }
@keyframes apPacketLift { from{transform:rotate(-7deg)} 48%{transform:translateY(3px) rotate(-9deg)} to{transform:translateY(-5px) rotate(-3deg)} }
@keyframes apFlapRelease { from{opacity:1;transform:rotateX(0)} 68%{opacity:.85} to{opacity:0;transform:rotateX(93deg)} }
@keyframes apLidLift { from{opacity:0;transform:scaleY(.12)} to{opacity:1;transform:none} }
@keyframes apLightOn { from{opacity:0;transform:scale(.6)} to{opacity:1;transform:none} }
@keyframes apSealRelease { 0%{transform:translate(-50%,-50%) scale(1)} 28%{transform:translate(-50%,-46%) scale(.88)} 100%{transform:translate(-50%,-42%) scale(.93)} }
@keyframes apBurstGlow { 0%{opacity:.1;transform:scale(.72)} 24%{opacity:1;transform:scale(1.09)} 69%{opacity:.8} 100%{opacity:0;transform:scale(1.13)} }
@keyframes apMoneyBurst {
  0%{opacity:0;transform:translate(-50%,-12%) rotate(0) scale(.38)}
  16%{opacity:1}
  40%{opacity:1;transform:translate(calc(-50% + var(--x) * var(--burst-distance,1)),calc(-50% + var(--y) * var(--burst-distance,1))) rotate(var(--turn)) scale(1.02)}
  68%{opacity:1;transform:translate(calc(-50% + var(--x) * var(--burst-distance,1)),calc(-40% + var(--y) * var(--burst-distance,1))) rotate(var(--turn)) scale(1)}
  100%{opacity:0;transform:translate(calc(-50% + var(--x) * var(--burst-distance,1)),calc(22px + var(--y) * var(--burst-distance,1))) rotate(calc(var(--turn) * 1.35)) scale(.78)}
}
@keyframes apResultIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@media (max-width:340px) {
  .apreceive-art { --burst-distance:.74 }
  .apreceive-open { max-width:210px }
}
@media (prefers-reduced-motion:reduce) {
  .apreceive-art *, .apreceive-result.is-new { animation:none!important }
  .ap-burst-piece { display:none }
}

/* ===== V2 · Group chat flow restyled to "YouApp wallet screens, redesigned" (Inter, ink #1E1050, lavender, gradient pills) ===== */
#phone.gxs{--gx-ink:#1E1050; --gx-plum:#2A1466; --gx-pu:#5E35B8; --gx-deep:#4B2A9E; --gx-lav:#F4EFFF; --gx-lav2:#E9E0FB; --gx-lil:#B79BF0; --gx-mintbg:#E2F6EE; --gx-mintdk:#0B6B4B; --gx-mut:#6E6688; --gx-line:#ECE7F7; --gx-grad:linear-gradient(100deg,#9A6BBF,#3D1C96); --gx-card:linear-gradient(135deg,#A887DA 0%,#6A45C2 45%,#3A1B92 100%)}
#phone.gxs .screen, #phone.gxs .sheet, #phone.gxs .dialog{font-family:Inter,-apple-system,system-ui,sans-serif; color:var(--gx-ink)}
#phone.gxs .topbar{height:50px; padding:0 16px; border-bottom:0!important}
#phone.gxs .topbar .t-headline{font:700 18px Inter; color:var(--gx-ink)}
#phone.gxs .topbar .iconbtn, #phone.gxs .ghtop .iconbtn{color:var(--gx-ink)}
#phone.gxs .ghtop .iconbtn{color:#fff}
#phone.gxs .search{height:46px; border:1.5px solid var(--gx-line); border-radius:14px; color:var(--gx-mut); font:500 14px Inter}
#phone.gxs .search:focus-within{border-color:var(--gx-pu); background:var(--gx-lav)}
#phone.gxs .kicker3{font:700 12px Inter; color:var(--gx-mut); text-transform:uppercase; letter-spacing:.6px; margin:18px 4px 6px}
/* buttons: .paybtn */
#phone.gxs .cta{border-top:0; padding:12px 16px 30px}
#phone.gxs .btn{height:56px; border-radius:999px; font:700 18px Inter}
#phone.gxs .btn-primary{background:var(--gx-grad); color:#fff; box-shadow:0 10px 24px rgba(75,42,158,.28)}
#phone.gxs .btn-primary[aria-disabled="true"]{background:#E9E5F2; color:#9A93AE; box-shadow:none}
#phone.gxs .btn-tertiary{background:var(--gx-lav); color:var(--gx-deep)}
#phone.gxs .link, #phone.gxs .gadd{color:var(--gx-deep); font-weight:700}
/* lists: .tx / .wr */
#phone.gxs .gav{border-radius:14px}
#phone.gxs .gav.pur{background:var(--gx-grad)}
#phone.gxs .clrow{padding:9px 4px; gap:12px}

#phone.gxs .clrow .cm small{font:500 12.5px Inter; color:var(--gx-mut)}
#phone.gxs .clrow .cr small{font:500 12px Inter; color:var(--gx-mut)}
#phone.gxs .ucount{background:var(--gx-grad); color:#fff; font:700 11px Inter}
#phone.gxs .cfab{border-radius:20px; background:var(--gx-grad); box-shadow:0 10px 24px rgba(75,42,158,.3)}
#phone.gxs .gmrow, #phone.gxs .gpkrow{gap:12px; padding:10px 4px; border-bottom:1px solid var(--gx-line)}
#phone.gxs .gmrow:last-child, #phone.gxs .gpkrow:last-child{border-bottom:0}
#phone.gxs .gmrow .cm b, #phone.gxs .gpkrow .cm b{font:700 15px Inter; color:var(--gx-ink)}
#phone.gxs .gmrow .cm small, #phone.gxs .gpkrow .cm small{font:500 12px Inter; color:var(--gx-mut)}
#phone.gxs .av40{border-radius:50%}
#phone.gxs .vb svg path:first-child{fill:var(--gx-pu)}
#phone.gxs .gchip{font:700 10.5px Inter; border-radius:999px; padding:2px 7px}
#phone.gxs .gchip.own{background:var(--gx-mintbg); color:var(--gx-mintdk)}
#phone.gxs .gchip.adm{background:var(--gx-lav); color:var(--gx-deep)}

#phone.gxs .gprow{gap:12px; padding:11px 14px; border-bottom:1px solid var(--gx-line)}
#phone.gxs .gprow:last-child{border-bottom:0}

#phone.gxs .gpt b, #phone.gxs .gprow > span b{font:600 14.5px Inter; color:var(--gx-ink)}
#phone.gxs .gpt small, #phone.gxs .gprow small{font:500 12px Inter; color:var(--gx-mut)}
#phone.gxs .gpn{font:500 13.5px Inter; color:var(--gx-mut)}
#phone.gxs .switch{background:#D9D3E8}

#phone.gxs.gx-gperm .cta{background:#F6F3FC}
/* chatroom */

.field.err .input,.field.err .select{border-color:var(--a-error); box-shadow:0 0 0 3px var(--a-error-surface)}
.helper{font-size:12px; line-height:16px; color:var(--a-info)}
.helper.neutral{color:var(--a-ink-3)}
.field.err .helper{color:var(--a-error)}
.row-between{display:flex; justify-content:space-between; align-items:center; gap:8px}
.select{display:flex; flex-direction:column; align-items:stretch; text-align:left; gap:2px; border:1px solid var(--a-line); border-radius:12px; background:var(--a-white); padding:10px 14px; width:100%}
.select .lab{font-size:14px; font-weight:500; color:var(--a-ink)}
.select .val{display:flex; justify-content:space-between; align-items:center; font-size:16px; line-height:24px}
.select .val.ph{color:var(--a-placeholder)}

/* ---------- top bars ---------- */
.topbar{flex:none; height:52px; display:flex; align-items:center; gap:16px; padding:0 16px}
.iconbtn{width:40px; height:40px; margin-left:-8px; border-radius:999px; border:0; background:none; display:grid; place-items:center; color:var(--a-ink)}
.iconbtn:active{background:var(--a-gray-100)}
.progress{flex:1; height:8px; border-radius:999px; background:var(--a-line); overflow:hidden}
.progress i{display:block; height:100%; background:var(--a-grad); border-radius:999px; transition:width .3s}
.skip{background:none; border:0; color:var(--a-indigo); font-weight:600; padding:8px 0}

/* ---------- welcome ---------- */
.welcome{background:linear-gradient(180deg,#3b1878 0%,#5a2fa6 46%,#8c63c4 78%,#f2ecfa 100%)}
.welcome .glow{position:absolute; inset:0; pointer-events:none; background:
  radial-gradient(240px 200px at 10% 2%, rgba(255,255,255,.12), transparent 70%),
  radial-gradient(220px 200px at 92% 0%, rgba(255,255,255,.10), transparent 70%)}
.chip-glass{display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 12px 0 10px; border-radius:999px; border:1px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.14); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); color:#fff; font-weight:600}
.flag{width:20px; height:20px; border-radius:50%; overflow:hidden; flex:none}
.flag svg{width:100%; height:100%; display:block}
.decor{color:var(--a-lav-200)}
.decor-word{display:inline-block; min-width:2.6em; text-align:right; transition:opacity .3s}
.myrt{display:flex; gap:6px; align-items:center; justify-content:center; font-size:12px; color:var(--a-ink-2)}
.myrt b{color:var(--a-indigo)}

/* ---------- sheets, dialogs, toasts ---------- */
.scrim{position:absolute; inset:0; background:var(--a-scrim); z-index:20}
.scrim.anim{animation:fade .2s ease-out}
.sheet{position:absolute; left:0; right:0; bottom:0; z-index:21; background:var(--a-white); border-radius:26px 26px 0 0; padding:20px 16px 34px; max-height:92%; overflow-y:auto}
.sheet.anim{animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px; height:5px; border-radius:3px; background:var(--a-line); margin:0 auto 16px}
.dialog{position:absolute; left:16px; right:16px; top:50%; transform:translateY(-50%); z-index:21; background:var(--a-white); border-radius:20px; padding:24px 20px 20px}
.dialog.anim{animation:pop .2s ease-out}
.toast{position:absolute; left:16px; right:16px; top:58px; z-index:30; display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:12px;
  background:var(--a-white); border:1px solid var(--a-line); font-size:14px; line-height:20px; animation:drop .25s ease-out}
.toast .ico{width:20px; height:20px; color:var(--a-info)}
.toast.err{border-color:var(--a-error-line)}
.toast.err .ico{color:var(--a-error)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0; transform:translateY(-46%) scale(.97)}to{opacity:1; transform:translateY(-50%)}}
@keyframes drop{from{opacity:0; transform:translateY(-8px)}to{opacity:1; transform:none}}
.divider{display:flex; align-items:center; gap:12px; color:var(--a-ink-3); font-size:12px}
.divider::before,.divider::after{content:""; flex:1; height:1px; background:var(--a-line)}
.social{display:flex; align-items:center; justify-content:center; gap:10px; height:56px; width:100%; border-radius:999px; border:1px solid var(--a-line); background:var(--a-white); font-size:16px; font-weight:600}
.social:active{background:var(--a-gray-100)}
.social .ico{width:22px; height:22px}
.terms{font-size:14px; line-height:20px; text-align:center; color:var(--a-ink-2)}
.terms .link{font-weight:500}

/* ---------- OTP ---------- */
.otp-bg{position:absolute; inset:0; background:#fff}
.otp-bg img{position:absolute; left:16px; top:224px; width:calc(100% - 32px); opacity:.95}
.otp-card{position:absolute; left:16px; right:16px; top:226px; z-index:21; background:#fff; border-radius:20px; padding:24px 16px 20px; text-align:center}
.boxes{display:flex; gap:10px; justify-content:center; margin-top:16px}
.box{width:48px; height:74px; border-radius:12px; border:1px solid var(--a-line); display:grid; place-items:center; font-size:30px; font-weight:600; background:#fff}
.box.cur{border-color:var(--a-indigo); background:var(--a-indigo-100)}
.box.cur::after{content:""; width:2px; height:30px; background:var(--a-indigo); animation:blink 1s steps(1) infinite}
.boxes.err .box{border-color:var(--a-error); color:var(--a-error)}
.boxes.ok .box{border-color:var(--a-success); color:var(--a-success)}
@keyframes blink{50%{opacity:0}}
.pad{position:absolute; left:0; right:0; bottom:0; z-index:21; background:#d1d3d9; padding:8px 6px 34px; display:grid; grid-template-columns:repeat(3,1fr); gap:7px}
.key{height:48px; border:0; border-radius:8px; background:#fcfcfe; font-size:24px; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1}
.key small{font-size:10px; letter-spacing:.14em; font-weight:600; margin-top:2px}
.key.ghost{background:transparent}
.key:active{background:#c0c3cb}

/* ---------- onboarding ---------- */
.onb .scroll{background:var(--a-bg-soft)}
.cake{height:240px; border-radius:16px; overflow:hidden; position:relative; background:linear-gradient(140deg,#fde3f1 0%,#efe1fb 55%,#e2d3fb 100%); display:flex; align-items:flex-end; justify-content:center}
.cake::before{content:""; position:absolute; width:290px; height:290px; border-radius:50%; background:rgba(255,255,255,.35); right:-150px; top:-170px}
.cake::after{content:""; position:absolute; width:290px; height:290px; border-radius:50%; background:rgba(214,170,240,.25); left:-200px; bottom:-170px}
.cake img{position:relative; z-index:1; width:346px; max-width:92%; display:block}
.gender{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.gcard{height:152px; border-radius:16px; border:1px solid var(--a-line); background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; font-weight:600; color:var(--a-ink-2)}
.gcard .ico{width:56px; height:56px; color:var(--a-line-strong)}
.gcard[aria-pressed="true"]{border:2px solid var(--a-indigo); background:var(--a-indigo-100); color:var(--a-indigo)}
.gcard[aria-pressed="true"] .ico{color:var(--a-indigo)}
.pill-choice{height:48px; border-radius:999px; border:1px solid var(--a-line); background:#fff; font-weight:600; color:var(--a-ink-2); width:100%}
.pill-choice[aria-pressed="true"]{border:2px solid var(--a-indigo); color:var(--a-indigo); background:var(--a-indigo-100)}
.err-text{color:var(--a-error); font-size:12px; line-height:16px}
.wheel{display:grid; grid-template-columns:1fr 1.4fr 1.1fr; gap:6px; height:220px; position:relative}
.wheel::before{content:""; position:absolute; left:0; right:0; top:88px; height:44px; border-radius:10px; background:var(--a-gray-100); z-index:0}
.wcol{overflow-y:auto; scroll-snap-type:y mandatory; padding:88px 0; position:relative; z-index:1; scrollbar-width:none; text-align:center}
.wcol::-webkit-scrollbar{display:none}
.wcol button{display:block; width:100%; height:44px; border:0; background:none; scroll-snap-align:center; font-size:17px; color:var(--a-ink-3)}
.wcol button[aria-selected="true"]{color:var(--a-indigo); font-weight:600}

/* ---------- discover ---------- */
.appbar{flex:none; height:56px; display:flex; align-items:center; justify-content:space-between; padding:0 16px}
.avatar{width:32px; height:32px; border-radius:50%; overflow:hidden; border:0; padding:0; background:var(--a-gray-100)}
.avatar img{width:100%; height:100%; display:block; object-fit:cover}
.htabs{display:flex; gap:28px}
.htabs button{border:0; background:none; padding:6px 2px; font-weight:600; color:var(--a-ink-3); position:relative}
.htabs button[aria-selected="true"]{color:var(--a-indigo)}
.htabs button[aria-selected="true"]::after{content:""; position:absolute; left:-10px; right:-10px; bottom:-4px; height:2px; background:var(--a-grad); border-radius:2px}
.banner img{width:100%; display:block}
.hostcta{margin:12px 16px 0; height:58px; border-radius:999px; background:var(--a-grad); color:#fff; border:0; display:flex; align-items:center; gap:12px; padding:0 18px 0 14px; width:calc(100% - 32px); text-align:left}
.hostcta .ico{width:24px; height:24px}
.hostcta .t1{font-size:12px; line-height:16px; font-weight:600}
.hostcta .t2{font-size:12px; line-height:16px; opacity:.85}
.hostcta b{margin-left:auto; font-size:14px}
.seg{margin:16px 16px 0; padding:4px; border-radius:999px; background:var(--a-indigo-100); display:grid; grid-template-columns:repeat(2,1fr)}
.seg button{height:40px; border:0; border-radius:999px; background:none; font-weight:600; font-size:13px; color:var(--a-indigo)}
.seg button[aria-selected="true"]{background:var(--a-grad); color:#fff}
.search{margin:16px 16px 0; height:48px; border:1px solid var(--a-line); border-radius:999px; display:flex; align-items:center; gap:10px; padding:0 16px; color:var(--a-ink-2); background:#fff; width:calc(100% - 32px)}
.search .ico{width:20px; height:20px}
.gp-h{margin:18px 20px 0}
.gp-h h2{margin:0; color:var(--a-ink); font-size:26px; font-weight:800; letter-spacing:-.5px; line-height:32px}
.gp-h p{display:flex; align-items:center; gap:4px; margin:2px 0 0; color:var(--a-ink-2); font-size:13px}
.gp-h .ico{width:15px; height:15px; color:var(--a-indigo)}
.gp-cats{display:flex; gap:22px; overflow-x:auto; padding:18px 20px 0; border-bottom:1px solid var(--a-line); scrollbar-width:none}
.gp-cats::-webkit-scrollbar{display:none}
.gp-cat{display:grid; flex:none; justify-items:center; gap:4px; padding:0 2px 10px; border:0; border-bottom:2.5px solid transparent; background:none; color:var(--a-ink-2); font-size:12px; font-weight:600; opacity:.7; transition:opacity .2s}
.gp-cat i{font-size:26px; font-style:normal; line-height:30px}
.gp-cat[aria-pressed="true"]{border-bottom-color:var(--a-indigo); color:var(--a-ink); opacity:1}
.gp-list{display:grid; gap:30px; padding:22px 16px 8px}
.gp-card{animation:gpIn .45s cubic-bezier(.2,.7,.2,1) both; animation-delay:var(--d,0ms)}
.gp-photo{position:relative; overflow:hidden; aspect-ratio:4/3; margin-bottom:8px; border-radius:22px; background:var(--a-gray-100); transition:transform .15s}
.gp-photo-open{position:absolute; inset:0; display:block; width:100%; height:100%; overflow:hidden; padding:0; border:0; background:none; text-align:left}
.gp-photo-open img{display:block; width:100%; height:100%; object-fit:cover}
.gp-photo::after{position:absolute; inset:auto 0 0; height:45%; background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.38)); content:""; pointer-events:none}
.gp-open{position:absolute; top:12px; left:12px; z-index:2; padding:5px 11px; border-radius:999px; background:rgba(255,255,255,.96); color:#6b6874; font-size:11.5px; font-weight:700}
.gp-open.on{color:#1e9e4a}
.gp-heart{position:absolute; top:8px; right:10px; z-index:3; display:grid; width:40px; height:40px; place-items:center; padding:0; border:0; background:none}
.gp-heart svg{width:26px; height:26px; fill:rgba(0,0,0,.35); stroke:#fff; stroke-width:2; stroke-linejoin:round; filter:drop-shadow(0 1px 3px rgba(0,0,0,.3))}
.gp-heart[aria-pressed="true"] svg{fill:#ff385c; animation:gpPop .35s}
.gp-cb{position:absolute; bottom:12px; left:12px; z-index:2; padding:6px 12px 7px; border-radius:14px; background:#1fc15b; color:#fff; line-height:1; box-shadow:0 6px 14px rgba(20,120,60,.35); pointer-events:none}
.gp-cb b{font-size:20px; font-weight:800; letter-spacing:-.4px}
.gp-cb span{display:block; margin-top:2px; font-size:10.5px; font-weight:700; opacity:.95}
.gp-main{display:grid; width:100%; gap:3px; padding:0; border:0; background:none; text-align:left}
.gp-row{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.gp-name{color:var(--a-ink); font-size:16.5px; font-weight:700; line-height:22px}
.gp-star{display:flex; align-items:center; gap:3px; color:var(--a-ink); font-size:14px; font-weight:700; white-space:nowrap}
.gp-star .ico{width:14px; height:14px; color:var(--a-ink)}
.gp-sub{display:flex; align-items:center; gap:5px; color:var(--a-ink-2); font-size:13.5px; line-height:19px}
.gp-sub .ico{width:15px; height:15px; flex:none; color:var(--a-ink-3)}
.gp-sub b{color:var(--a-ink); font-weight:600}
.gp-rev{display:-webkit-box; overflow:hidden; margin:8px 0 0; padding:10px 12px; border-radius:14px; background:var(--a-indigo-100); color:var(--a-ink); font-size:13px; line-height:18px; -webkit-box-orient:vertical; -webkit-line-clamp:2}
.gp-acts{display:grid; grid-template-columns:1.1fr 1fr 1.2fr; gap:8px; margin-top:10px}
.gp-pay,.gp-t{display:flex; height:42px; align-items:center; justify-content:center; gap:6px; border:0; border-radius:999px; font-size:13.5px; font-weight:700; white-space:nowrap; transition:transform .12s}
.gp-pay:active,.gp-t:active{transform:scale(.96)}
.gp-pay{background:var(--a-grad); color:#fff; box-shadow:0 6px 14px rgba(56,22,142,.25)}
.gp-t{background:var(--a-indigo-100); color:var(--a-indigo)}
.gp-attr{margin:6px 16px 110px; color:var(--a-ink-3); font-size:11.5px; text-align:center}
@keyframes gpIn{from{opacity:0; transform:translateY(14px)}}
@keyframes gpPop{40%{transform:scale(1.35)}}
@media (prefers-reduced-motion:reduce){.gp-card,.gp-heart svg{animation:none!important}}
.sec-title{display:flex; align-items:center; gap:4px; font-weight:600; color:var(--a-indigo); font-size:16px; line-height:24px; padding:20px 16px 10px}
.sec-title .ico{width:16px; height:16px}
.skel-row{display:flex; gap:10px; padding:0 16px; overflow:hidden}
.skel{border-radius:12px; background:linear-gradient(90deg,#f2f0f5 0%,#faf9fb 50%,#f2f0f5 100%); background-size:200% 100%; animation:shim 1.6s infinite linear}
@keyframes shim{to{background-position:-200% 0}}
.phase-note{margin:20px 16px; padding:14px 16px; border-radius:16px; border:1px dashed var(--a-indigo-200); background:var(--a-indigo-100); color:var(--a-indigo); display:flex; gap:10px; align-items:flex-start}
.phase-note .ico{width:20px; height:20px}
.bnav{flex:none; height:88px; border-top:1px solid var(--a-line); background:#fff; display:grid; grid-template-columns:1fr 1fr 1fr; position:relative; padding-bottom:18px}
.bnav button{border:0; background:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:14px; color:var(--a-ink-3); font-weight:500}
.bnav button .ico{width:30px; height:30px}
.bnav button[aria-current="page"]{color:var(--a-indigo); font-weight:600}
.bnav .scanbtn{position:relative}
.bnav .scanbtn .fab{position:absolute; top:-22px; left:50%; transform:translateX(-50%); width:56px; height:56px; border-radius:16px; background:var(--a-grad); color:#fff; display:grid; place-items:center}
.bnav .scanbtn .fab .ico{width:30px; height:30px}
.bnav .scanbtn span.lbl{margin-top:34px}
.menu{position:absolute; right:16px; top:104px; z-index:21; width:220px; background:#fff; border-radius:16px; border:1px solid var(--a-line); padding:6px}
.menu button{display:flex; gap:10px; align-items:center; width:100%; border:0; background:none; padding:12px; border-radius:10px; font-weight:600; text-align:left}
.menu button:active{background:var(--a-gray-100)}

/* ---------- stub ---------- */
.stub{padding:24px 16px; display:flex; flex-direction:column; gap:16px}
.stub ul{margin:0; padding-left:18px; color:var(--a-ink-2); display:grid; gap:6px}

/* ---------- panel ---------- */
.panel{flex:none; width:340px; position:sticky; top:24px; max-height:calc(100dvh - 48px); overflow-y:auto; background:var(--surface); border:1px solid var(--rule); border-radius:20px; padding:18px; display:flex; flex-direction:column; gap:18px; color:var(--text)}
.panel h1{font-size:16px; line-height:22px; margin:0; font-weight:700}
.panel .kicker{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-3); font-weight:600}
.panel .badge{display:inline-flex; align-items:center; height:22px; padding:0 8px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-size:12px; font-weight:600}
.pgroup{display:flex; flex-direction:column; gap:8px}
.pgroup h2{margin:0; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-3); font-weight:600}
.now{border:1px solid var(--rule); border-radius:14px; padding:12px; background:var(--surface-2); display:grid; gap:6px}
.now .nm{font-weight:700; font-size:15px}
.now .ref{font-size:12px; color:var(--text-2)}
.now ul{margin:2px 0 0; padding-left:16px; font-size:12.5px; line-height:18px; color:var(--text-2); display:grid; gap:3px}
.ctl{display:grid; gap:6px}
.ctl .lab{font-size:13px; font-weight:600}
.segp{display:flex; flex-wrap:wrap; gap:4px; padding:3px; border-radius:12px; background:var(--surface-2); border:1px solid var(--rule)}
.segp button{flex:1 1 auto; min-height:32px; border:0; border-radius:9px; background:none; font-size:12.5px; font-weight:600; color:var(--text-2); padding:0 8px}
.segp button[aria-pressed="true"]{background:var(--surface); color:var(--accent); box-shadow:0 0 0 1px var(--accent-line)}
.segp button:disabled{opacity:.45; cursor:not-allowed}
.pbtns{display:flex; flex-wrap:wrap; gap:6px}
.pbtn{min-height:34px; border-radius:10px; border:1px solid var(--rule); background:var(--surface); padding:0 12px; font-size:13px; font-weight:600; color:var(--text); display:inline-flex; align-items:center; gap:6px}
.pbtn .ico{width:16px; height:16px}
.pbtn:hover{border-color:var(--accent-line)}
.jump{display:grid; gap:2px}
.jump button{display:flex; justify-content:space-between; gap:8px; text-align:left; border:0; background:none; padding:7px 8px; border-radius:8px; font-size:13px; color:var(--text)}
.jump button:hover{background:var(--surface-2)}
.jump button[aria-current="true"]{background:var(--accent-soft); color:var(--accent); font-weight:600}
.jump small{color:var(--text-3); font-size:11px}
.later{font-size:12.5px; color:var(--text-2); line-height:18px}
.later b{color:var(--text)}
code.k{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; background:var(--surface-2); border:1px solid var(--rule); border-radius:6px; padding:1px 6px}
.fab-panel{display:none}
.panel .close{display:none}

@media (max-width: 820px){
  .stage{padding:0; gap:0}
  .device{width:100%; height:100dvh; min-height:0; border-radius:0; padding:0; background:transparent; box-shadow:none}
  .phone{border-radius:0}
  .home-ind{display:none}
  .panel{position:fixed; inset:auto 0 0 0; top:auto; width:auto; max-height:82dvh; border-radius:20px 20px 0 0; z-index:100; transform:translateY(105%); transition:transform .25s;
    padding-left:max(18px, env(safe-area-inset-left,0px)); padding-right:max(18px, env(safe-area-inset-right,0px)); padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  .panel.open{transform:none}
  .panel .close{display:inline-grid}
  .fab-panel{display:grid; place-items:center; position:fixed; z-index:99; right:calc(12px + env(safe-area-inset-right,0px)); top:calc(50% - 22px);
    width:44px; height:44px; border-radius:14px; border:1px solid var(--rule); background:var(--surface); color:var(--accent)}
  .fab-panel .ico{width:22px; height:22px}
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
/* ===== Phase 2 components ===== */
.flip svg{transform:rotate(180deg)}
.pad16{padding-left:16px; padding-right:16px}
.h2{font-size:18px; line-height:26px; font-weight:700; color:var(--a-indigo); margin:24px 0 12px; padding:0 16px}
.hscroll{display:flex; gap:12px; overflow-x:auto; padding:0 16px; scrollbar-width:none; scroll-snap-type:x proximity}
.hscroll::-webkit-scrollbar{display:none}
.hscroll > *{flex:none; scroll-snap-align:start}
.card{border:0; background:none; padding:0; text-align:left; display:flex; flex-direction:column; gap:4px; min-width:0}
.cimg{display:block; position:relative; border-radius:16px; overflow:hidden; background:var(--a-gray-100)}

.spin.big{display:inline-block; width:40px; height:40px; border-radius:50%; border:3px solid var(--a-indigo-200); border-top-color:var(--a-indigo); animation:spin .8s linear infinite}
.toast{pointer-events:none}
.toast.push{background:rgba(32,30,36,.94); color:#fff; border-color:transparent; align-items:center}
.toast.push .subtle{color:rgba(255,255,255,.6)}
.pico{width:32px; height:32px; border-radius:8px; background:var(--a-grad); display:grid; place-items:center; flex:none}
.pico img{width:20px; height:20px; filter:brightness(10)}
.gatehero{display:grid; place-items:center; margin:16px 0 8px}
.gatehero img{width:195px; max-width:60%}
.verify-intro-bar{position:relative; justify-content:center}
/* title centred on the screen, not between uneven side items */
.verify-intro-bar .verify-intro-back{position:absolute; left:12px; top:50%; transform:translateY(-50%)}
.verify-intro-bar > span:last-child:not(.wv-title){display:none}
.verify-intro-bar .wv-title{font-size:17px; font-weight:700; color:#21144e}
.verify-intro-back{position:absolute; left:16px; margin:0}
.verify-intro-content{display:flex; flex-direction:column; padding:8px 16px 6px}
.wv-hero{display:block; width:100%; height:156px; flex:none}
.wv-heading{margin:8px 0 2px; color:#21144e; font-size:24px; line-height:30px; text-align:center; font-weight:700}
.wv-subheading{margin:0 0 8px; color:#716a7e; font-size:15px; line-height:20px; text-align:center; text-wrap:balance}
.wv-table{overflow:hidden; border:1px solid #e6e3eb; border-radius:20px; background:#fff}
.wv-table-head,.wv-table-row{display:grid; grid-template-columns:minmax(0,1fr) 64px 72px; align-items:center}
.wv-table-head{height:34px; background:#faf9fc; color:#858091; font-size:12px; font-weight:600; text-align:center}
.wv-table-head span:last-child{color:#4b91ee}
.wv-table-row{min-height:40px; border-top:1px solid #e9e7ed}
.wv-table-row:last-child{min-height:48px}
.wv-table-row>span:first-child{padding:0 6px 0 14px; color:#241d3f; font-size:13px; line-height:17px; font-weight:600}
.wv-status{width:24px; height:24px; justify-self:center; display:grid; place-items:center}
.wv-status svg{width:15px; height:15px}
.wv-status.now{padding:0; border:0; border-radius:50%; background:#e3f6ee; color:#23966a}
.wv-now-check{display:block; width:15px; height:15px; line-height:0}
.wv-now-check svg{display:block; width:100%; height:100%}
.wv-status.locked{color:#b7b3c0}
.wv-status.verified{border-radius:50%; background:#4b91ee; color:#fff}
.wv-status.verified svg{width:16px; height:16px}
.wv-actions{display:flex; flex-direction:column; align-items:stretch; padding-top:8px}
.wv-actions .btn{height:56px; font-size:16px}
.wv-later{height:32px; border:0; background:none; color:var(--a-indigo); font-weight:600}
.wv-terms{height:32px; border:0; background:none; color:var(--a-indigo); font-size:13px}
.gatehead{font-size:22px; line-height:30px; font-weight:700; color:var(--a-indigo); text-align:center; margin:4px 16px 18px; text-wrap:balance}
.rejhead{font-size:22px; line-height:30px; font-weight:800; text-align:center; margin:4px 16px 8px; color:var(--a-ink)}
.rejhead span{color:var(--a-error)}
.notesbox{display:flex; gap:10px; align-items:flex-start; background:var(--a-error-surface); border-radius:12px; padding:12px; color:var(--a-error)}
.notesbox > .ico{width:20px; height:20px}
.notesbox div{display:flex; flex-direction:column; gap:4px; font-size:13px; line-height:18px}
.notesbox b{font-size:15px}
.benefits{border:1px solid var(--a-line); border-radius:16px; padding:4px 14px}
.benefits > div{padding:12px 0; border-bottom:1px solid var(--a-line); display:flex; flex-direction:column; gap:4px; font-size:14px}
.benefits > div.row-between{flex-direction:row; align-items:center; gap:10px}
.benefits > div:last-child{border-bottom:0}
.benefits span span, .benefits > div > span{color:var(--a-ink-3); font-size:13px; line-height:18px}
.benefits > div > span > b{display:block; color:var(--a-ink); font-size:14px}
.okchip{flex:none; font-size:11px; font-weight:600; color:var(--a-indigo)!important; background:var(--a-indigo-100); padding:3px 8px; border-radius:999px}
.unl{flex:none; font-size:11px; font-weight:600; color:var(--a-success)!important; background:#e6f6ec; padding:3px 8px; border-radius:999px}
.gradtext{background:var(--a-grad); -webkit-background-clip:text; background-clip:text; color:transparent}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15); opacity:.8}}
.scanart{margin:24px 16px 0; padding:18px; border-radius:16px; background:var(--a-indigo-100); display:flex; gap:12px; align-items:center; color:var(--a-indigo)}
.scanart > .ico{width:40px; height:40px}

/* upload photos */
.kgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.kslot{position:relative; border:0; padding:0; border-radius:16px; overflow:hidden; aspect-ratio:1; background:#fff; display:block; width:100%}
.kslot.big{grid-column:1/-1; aspect-ratio:16/11}
.kslot img{width:100%; height:100%; object-fit:cover; display:block}
.kslot.empty{border:1.5px dashed var(--a-line-strong); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:var(--a-indigo); font-weight:600; font-size:14px}
.kslot.empty .ico{width:32px; height:32px; padding:6px; border-radius:50%; background:var(--a-indigo-100)}
.kchip{position:absolute; left:10px; top:10px; background:rgba(255,255,255,.9); border-radius:999px; padding:4px 10px; font-size:12px; font-weight:600}
.kstat{position:absolute; right:10px; top:10px; border-radius:999px; padding:4px 10px; font-size:12px; font-weight:600; display:flex; gap:4px; align-items:center}
.kstat .ico{width:14px; height:14px}
.kstat.pend{background:#fff2e6; color:#e07b12}
.kstat.rej{background:var(--a-error-surface); color:var(--a-error)}
.kslot:not(.big) .kstat{left:8px; right:auto; top:auto; bottom:8px}
.krep{position:absolute; inset:auto 0 0 0; background:rgba(211,37,47,.88); color:#fff; font-weight:600; font-size:13px; padding:8px; text-align:center}
.kslot:not(.big) .krep + .kstat, .kslot:not(.big) .kstat.rej{bottom:40px}

/* didit stand-in */
.didit-cam{height:260px; border-radius:20px; background:#1d1b20; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:20px; margin-top:6px}
.didit-cam.intro{background:var(--a-indigo-100); color:var(--a-indigo)}
.didit-cam.intro .ico{width:48px; height:48px}
.didit-cam p{margin:0; font-size:14px; line-height:20px; max-width:260px}
.idframe{width:220px; height:138px; border:2px dashed rgba(255,255,255,.7); border-radius:14px; display:grid; place-items:center; font-size:13px; opacity:.9; animation:pulse 1.2s ease-in-out infinite}
.faceframe{width:130px; height:170px; border:3px solid #7ee2a8; border-radius:50%; animation:pulse 1.2s ease-in-out infinite}
.dsteps{list-style:none; margin:16px 0 0; padding:0; display:grid; gap:10px}
.dsteps li{display:flex; gap:12px; align-items:flex-start; padding:12px; border:1px solid var(--a-line); border-radius:14px}
.dsteps li.now{border-color:var(--a-info); background:var(--a-indigo-100)}
.dsteps .n{width:26px; height:26px; border-radius:50%; background:var(--a-gray-100); display:grid; place-items:center; font-weight:700; font-size:13px; flex:none}
.dsteps li.done .n{background:var(--a-success); color:#fff}
.dsteps li.done .n .ico{width:16px; height:16px}
.dsteps div{display:flex; flex-direction:column; gap:2px; font-size:14px}
.dsteps span{color:var(--a-ink-2); font-size:13px}
.rejlist{margin-top:14px; border:1px solid var(--a-line); border-radius:16px; padding:0 14px}
.rejitem{border-bottom:1px solid var(--a-line)}
.rejitem:last-child{border-bottom:0}
.rejitem button{display:flex; align-items:center; gap:10px; width:100%; border:0; background:none; padding:14px 0; font-size:15px; text-align:left}
.rejitem button > .ico:first-child{width:20px; height:20px; color:var(--a-error)}
.rejitem p{margin:0 0 14px 30px; font-size:13px; line-height:18px; color:var(--a-ink-2)}
.box.dot{font-size:34px}

/* booking */
.datestrip{gap:6px; padding-top:10px}
.datestrip button{width:52px; height:74px; border:0; border-radius:16px; background:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:var(--a-ink); position:relative}
.datestrip b{font-size:20px}
.datestrip span{font-size:12px; color:var(--a-ink-2)}
.datestrip button[aria-selected="true"]{background:var(--a-indigo-100); color:var(--a-indigo)}
.datestrip button[aria-selected="true"] span{color:var(--a-indigo)}
.datestrip i{position:absolute; bottom:8px; width:5px; height:5px; border-radius:50%; background:var(--a-indigo)}
.schsvc{padding:14px 16px; border-bottom:1px solid var(--a-line)}
.schsvc .price{display:block; font-weight:700; font-size:14px; margin-top:2px}
.thumb64{width:64px; height:64px; border-radius:12px; object-fit:cover; flex:none}
.thumb56{width:56px; height:56px; border-radius:10px; object-fit:cover; flex:none}
.thumb80{width:80px; height:80px; border-radius:12px; object-fit:cover; flex:none}
.slots{gap:8px}
.slot2{height:38px; padding:0 12px; border-radius:8px; border:1px solid var(--a-line); background:#fff; font-size:13px; font-weight:600; color:var(--a-ink)}
.slot2.sel{border-color:var(--a-indigo); color:var(--a-indigo); background:var(--a-indigo-100)}
.slot2[disabled]{background:var(--a-gray-100); color:var(--a-ink-3); border-color:transparent}
.stepper{display:inline-flex; align-items:center; gap:10px}
.stepper button{width:26px; height:26px; border-radius:6px; border:1px solid var(--a-line-strong); background:#fff; color:var(--a-indigo); font-size:16px; line-height:1; display:grid; place-items:center; padding:0}
.stepper button[disabled]{color:var(--a-line-strong); border-color:var(--a-line)}
.stepper > span{display:flex; flex-direction:column; align-items:center; min-width:34px; font-size:16px}
.stepper small{font-size:11px; color:var(--a-ink-2)}
.stepper.compact{gap:6px}
.stepper.compact > span{flex-direction:row; gap:3px; font-size:12px; border:1px solid var(--a-line); border-radius:6px; padding:3px 8px; white-space:nowrap}
.stepper.compact > span b{font-size:12px}
.stepper.compact button{width:22px; height:22px; font-size:14px}
.expslot{display:flex; flex-direction:column; gap:6px; text-align:left; border:1px solid var(--a-line); border-radius:14px; padding:14px; background:#fff; font-size:15px; width:100%}
.expslot b + b{font-size:16px}
.expslot > span{align-self:flex-end; font-size:12px; font-weight:600; color:var(--a-indigo)}
.expslot > span.bad{color:var(--a-error)}
.expslot.sel{border-color:var(--a-indigo); box-shadow:0 0 0 1px var(--a-indigo)}
.expslot[disabled]{background:var(--a-gray-100); color:var(--a-ink-3); border-color:transparent}
.paybar{display:flex; align-items:center; gap:16px}
.paybar > div{flex:none; display:flex; flex-direction:column}
.paybar > div b{color:var(--a-indigo); font-size:18px}
.paybar .btn{flex:1}
.hr{height:1px; background:var(--a-line)}
.pmeth{display:flex; align-items:center; justify-content:space-between; gap:12px; border:1px solid var(--a-line); border-radius:14px; padding:12px 14px; background:#fff; text-align:left; width:100%; font-size:14px}
.pmeth > i{width:20px; height:20px; border-radius:50%; border:2px solid var(--a-line-strong); flex:none}
.pmeth.on{border-color:var(--a-indigo); box-shadow:0 0 0 1px var(--a-indigo)}
.pmeth.on > i{border:6px solid var(--a-indigo)}
.pmeth[aria-disabled="true"]{background:var(--a-gray-100)}
.pmeth[aria-disabled="true"] > i{opacity:.4}
.balamt{font-size:20px}
.brands{display:flex; flex-wrap:wrap; gap:4px}
.brands i{font-style:normal; font-size:10px; font-weight:700; border:1px solid var(--a-line); border-radius:4px; padding:2px 5px; color:var(--a-ink-2); background:#fff}
.kv{display:flex; justify-content:space-between; gap:12px; padding:6px 0; font-size:14px; color:var(--a-ink-2)}
.kv b{color:var(--a-ink)}
.kv span small{display:block; font-size:12px; color:var(--a-ink-3)}
.kv.total{border-top:1px solid var(--a-line); margin-top:6px; padding-top:10px; color:var(--a-ink); font-weight:600}
.kv.total b{color:var(--a-indigo); font-size:16px}
.okbig{display:inline-grid; place-items:center; width:84px; height:84px; border-radius:50%; background:#e6f6ec; color:var(--a-success)}
.okbig .ico{width:44px; height:44px}
.chatbg{background:linear-gradient(180deg,#f6f1fc,#efe8fa); padding:12px 12px 16px; display:flex; flex-direction:column; gap:10px}
.bkcard{border:0; border-radius:16px; background:#fff; padding:12px; display:block; width:100%; text-align:left; box-shadow:0 2px 8px rgba(56,22,142,.06)}
.bkcard .kind{display:flex; gap:6px; align-items:center; color:var(--a-info); font-weight:600; font-size:14px}
.bkcard .kind .ico{width:18px; height:18px}
.bkcard .ico{width:16px; height:16px}
.stchip{font-size:12px; font-weight:600; padding:3px 10px; border-radius:999px; white-space:nowrap}
.stchip.pend{background:#fff2e6; color:#e07b12}
.stchip.acc{background:#e6f6ec; color:var(--a-success)}
.stchip.done{background:var(--a-indigo-100); color:var(--a-info)}
.stchip.ref{background:var(--a-error-surface); color:var(--a-error)}
.sysline{text-align:center; font-size:12px; color:var(--a-ink-2); margin:4px 0}
.sysmsg{align-self:flex-start; max-width:88%; background:var(--a-indigo-100); border-radius:16px; padding:12px 14px; font-size:14px; line-height:20px}
.bub{align-self:flex-start; max-width:80%; background:#fff; border-radius:16px 16px 16px 4px; padding:10px 12px; font-size:14px; line-height:20px; overflow-wrap:anywhere}
.bub span{display:block; text-align:right; font-size:11px; color:var(--a-ink-3); margin-top:4px}
.bub.me{align-self:flex-end; background:var(--a-grad); color:#fff; border-radius:16px 16px 4px 16px}
.bub.me span{color:rgba(255,255,255,.75)}
.stars.big{display:flex; justify-content:center; gap:10px; margin-top:10px; border:0; background:none; padding:0; width:100%}
.stars.big .ico{width:34px; height:34px; color:var(--a-line-strong); border:0; background:none; padding:0}
.stars.big .ico.on{color:var(--a-info)}
.stars.big button.ico{cursor:pointer}
.switch{width:46px; height:28px; border-radius:999px; border:0; background:var(--a-line-strong); position:relative; padding:0; flex:none}
.switch i{position:absolute; left:3px; top:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:left .2s}
.switch.on{background:var(--a-indigo)}
.switch.on i{left:21px}
.ptab{height:38px; padding:0 14px; border-radius:999px; border:0; background:var(--a-gray-100); color:var(--a-ink-2); font-weight:600; display:flex; gap:6px; align-items:center}
.ptab i{font-style:normal; font-size:11px; min-width:18px; height:18px; border-radius:9px; background:var(--a-indigo); color:#fff; display:grid; place-items:center; padding:0 5px}
.ptab.on{background:var(--a-grad); color:#fff}
.ptab.on i{background:#fff; color:var(--a-indigo)}
.plancard{border-radius:18px; background:var(--a-grad); padding:4px}
.plancard .ph{display:flex; gap:10px; align-items:center; color:#fff; padding:10px 10px 12px}
.plancard .ph div{display:flex; flex-direction:column; gap:2px; font-size:13px}
.plancard .ph b{font-size:15px}
.plancard .pb{background:#fff; border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:2px; font-size:14px}
.plancard .pb span{color:var(--a-ink-2); font-size:13px}
.plancard .pr{color:var(--a-indigo); font-size:16px; margin-top:4px}
.planpill{position:absolute; left:50%; transform:translateX(-50%); bottom:120px; z-index:6; height:40px; padding:0 18px; border-radius:999px; border:0; background:var(--a-grad); color:#fff; font-weight:600; display:flex; gap:8px; align-items:center; box-shadow:0 6px 18px rgba(56,22,142,.35)}
.planpill .ico{width:20px; height:20px}
.prep{list-style:none; margin:0; padding:0; display:grid; gap:12px}
.prep li{display:flex; gap:12px; align-items:center; font-size:15px}
.prep .ico{width:22px; height:22px; border-radius:50%; background:var(--a-success); color:#fff; padding:3px}
.btn-secondary .ico, .btn-tertiary .ico{width:20px; height:20px}
.btn-sm{gap:8px}

/* ===== Phase 4 wallet ===== */
.tok{width:36px; height:36px; border-radius:50%; display:inline-grid; place-items:center; color:#fff; font-weight:700; font-size:14px; flex:none}
.tok-USDT{background:#26a17b} .tok-USDC{background:#2775ca} .tok-XSGD{background:#e03a3e; font-size:11px} .tok-MYRT{background:linear-gradient(135deg,#d23f5b,#5b2a86)} .tok-bank{background:var(--a-indigo-100); color:var(--a-indigo)}
.tok .ico{width:18px; height:18px}
.balscroll{gap:10px; padding-top:6px; scroll-snap-type:x mandatory}
.balcard{width:calc(100% - 28px); min-height:170px; border-radius:20px; padding:16px; color:#fff; background:radial-gradient(circle at 85% 30%, rgba(255,255,255,.18) 0 22%, transparent 23%), linear-gradient(135deg,#a77bc8 0%,#6b3fb5 55%,#3a1a8f 100%); display:flex; flex-direction:column; gap:4px; position:relative}
.balcard.alt{background:radial-gradient(circle at 85% 30%, rgba(255,255,255,.18) 0 22%, transparent 23%), linear-gradient(135deg,#c65a8f 0%,#8a3b9e 55%,#4a1f84 100%)}
.balcard .cur{display:flex; align-items:center; gap:6px; font-size:12px; margin-top:8px; opacity:.95}
.balcard .cur .tok{width:18px; height:18px; font-size:9px}
.balcard .amt{font-size:34px; line-height:40px}
.balcard .foot{font-size:11px; opacity:.85; margin-top:auto}
.eyebtn{border:0; background:none; color:#fff; padding:0; display:grid}
.eyebtn .ico{width:20px; height:20px}
.frozenbar{margin-top:8px; border:0; border-radius:10px; background:rgba(255,255,255,.95); color:var(--a-indigo); font-size:12px; font-weight:600; padding:8px 10px; display:flex; gap:6px; align-items:center; text-align:left}
.frozenbar .ico{width:16px; height:16px}
.wacts{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px}
.wacts button{border:1px solid var(--a-line); background:#fff; border-radius:14px; padding:10px 4px; display:flex; flex-direction:column; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--a-ink)}
.wacts button span{width:32px; height:32px; border-radius:10px; background:var(--a-indigo-100); color:var(--a-indigo); display:grid; place-items:center}
.wacts .ico{width:18px; height:18px}
.wrow{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--a-line)}
.wrow:last-child{border-bottom:0}
.wrow > .ico{width:22px; height:22px; color:var(--a-indigo)}
.wrow > span:not(.tok){flex:1; min-width:0; display:flex; flex-direction:column; font-size:14px}
.wrow small, .coupon small{color:var(--a-ink-3); font-size:12px}
.lockcard{border:1.5px dashed var(--a-info); border-radius:18px; min-height:150px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; background:linear-gradient(135deg,#faf8fd,#f1ebfa); font-size:17px}
.lockcard > .ico{width:24px; height:24px}
.coupon{width:100%; border:0; border-radius:16px; background:var(--a-indigo-100); padding:12px 14px; display:flex; align-items:center; gap:12px; text-align:left}
.coupon > .ico{width:34px; height:34px; padding:7px; border-radius:50%; background:#fff; color:var(--a-indigo)}
.coupon > span:not(.ico){display:flex; flex-direction:column; flex:1; font-size:14px}
.minibtn{border:0; background:var(--a-indigo-100); color:var(--a-indigo); border-radius:8px; padding:6px 10px; font-size:12px; font-weight:600; display:flex; gap:4px; align-items:center}
.minibtn .ico{width:14px; height:14px}
.kvrow{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--a-line); font-size:14px}
.kvrow:last-child{border-bottom:0}
.kvrow small{display:block; color:var(--a-ink-3); font-size:12px; font-weight:400}
.txrow{display:flex; align-items:center; gap:12px; width:100%; border:0; border-bottom:1px solid var(--a-line); background:none; padding:12px 0; text-align:left}
.txic{width:40px; height:40px; border-radius:12px; border:1px solid var(--a-line); display:grid; place-items:center; flex:none}
.txic .ico{width:24px; height:24px; padding:4px; border-radius:50%; background:var(--a-grad); color:#fff}
.txm{flex:1; min-width:0; display:flex; flex-direction:column; font-size:14px}
