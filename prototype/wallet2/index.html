.dialog{position:absolute; left:16px; right:16px; top:50%; transform:translateY(-50%); z-index:21; background:var(--a-white); border-radius:20px; padding:24px 20px 20px}
.dialog.anim{animation:pop .2s ease-out}
.toast{position:absolute; left:16px; right:16px; top:58px; z-index:30; display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:12px;
  background:var(--a-white); border:1px solid var(--a-line); font-size:14px; line-height:20px; animation:drop .25s ease-out}
.toast .ico{width:20px; height:20px; color:var(--a-info)}
.toast.err{border-color:var(--a-error-line)}
.toast.err .ico{color:var(--a-error)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0; transform:translateY(-46%) scale(.97)}to{opacity:1; transform:translateY(-50%)}}
@keyframes drop{from{opacity:0; transform:translateY(-8px)}to{opacity:1; transform:none}}
.divider{display:flex; align-items:center; gap:12px; color:var(--a-ink-3); font-size:12px}
.divider::before,.divider::after{content:""; flex:1; height:1px; background:var(--a-line)}
.social{display:flex; align-items:center; justify-content:center; gap:10px; height:56px; width:100%; border-radius:999px; border:1px solid var(--a-line); background:var(--a-white); font-size:16px; font-weight:600}
.social:active{background:var(--a-gray-100)}
.social .ico{width:22px; height:22px}
.terms{font-size:14px; line-height:20px; text-align:center; color:var(--a-ink-2)}
.terms .link{font-weight:500}

/* ---------- OTP ---------- */
.otp-bg{position:absolute; inset:0; background:#fff}
.otp-bg img{position:absolute; left:16px; top:224px; width:calc(100% - 32px); opacity:.95}
.otp-card{position:absolute; left:16px; right:16px; top:226px; z-index:21; background:#fff; border-radius:20px; padding:24px 16px 20px; text-align:center}
.boxes{display:flex; gap:10px; justify-content:center; margin-top:16px}
.box{width:48px; height:74px; border-radius:12px; border:1px solid var(--a-line); display:grid; place-items:center; font-size:30px; font-weight:600; background:#fff}
.box.cur{border-color:var(--a-indigo); background:var(--a-indigo-100)}
.box.cur::after{content:""; width:2px; height:30px; background:var(--a-indigo); animation:blink 1s steps(1) infinite}
.boxes.err .box{border-color:var(--a-error); color:var(--a-error)}
.boxes.ok .box{border-color:var(--a-success); color:var(--a-success)}
@keyframes blink{50%{opacity:0}}
.pad{position:absolute; left:0; right:0; bottom:0; z-index:21; background:#d1d3d9; padding:8px 6px 34px; display:grid; grid-template-columns:repeat(3,1fr); gap:7px}
.key{height:48px; border:0; border-radius:8px; background:#fcfcfe; font-size:24px; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1}
.key small{font-size:10px; letter-spacing:.14em; font-weight:600; margin-top:2px}
.key.ghost{background:transparent}
.key:active{background:#c0c3cb}

/* ---------- onboarding ---------- */
.onb .scroll{background:var(--a-bg-soft)}
.cake{height:240px; border-radius:16px; overflow:hidden; position:relative; background:linear-gradient(140deg,#fde3f1 0%,#efe1fb 55%,#e2d3fb 100%); display:flex; align-items:flex-end; justify-content:center}
.cake::before{content:""; position:absolute; width:290px; height:290px; border-radius:50%; background:rgba(255,255,255,.35); right:-150px; top:-170px}
.cake::after{content:""; position:absolute; width:290px; height:290px; border-radius:50%; background:rgba(214,170,240,.25); left:-200px; bottom:-170px}
.cake img{position:relative; z-index:1; width:346px; max-width:92%; display:block}
.gender{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.gcard{height:152px; border-radius:16px; border:1px solid var(--a-line); background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; font-weight:600; color:var(--a-ink-2)}
.gcard .ico{width:56px; height:56px; color:var(--a-line-strong)}
.gcard[aria-pressed="true"]{border:2px solid var(--a-indigo); background:var(--a-indigo-100); color:var(--a-indigo)}
.gcard[aria-pressed="true"] .ico{color:var(--a-indigo)}
.pill-choice{height:48px; border-radius:999px; border:1px solid var(--a-line); background:#fff; font-weight:600; color:var(--a-ink-2); width:100%}
.pill-choice[aria-pressed="true"]{border:2px solid var(--a-indigo); color:var(--a-indigo); background:var(--a-indigo-100)}
.err-text{color:var(--a-error); font-size:12px; line-height:16px}
.wheel{display:grid; grid-template-columns:1fr 1.4fr 1.1fr; gap:6px; height:220px; position:relative}
.wheel::before{content:""; position:absolute; left:0; right:0; top:88px; height:44px; border-radius:10px; background:var(--a-gray-100); z-index:0}
.wcol{overflow-y:auto; scroll-snap-type:y mandatory; padding:88px 0; position:relative; z-index:1; scrollbar-width:none; text-align:center}
.wcol::-webkit-scrollbar{display:none}
.wcol button{display:block; width:100%; height:44px; border:0; background:none; scroll-snap-align:center; font-size:17px; color:var(--a-ink-3)}
.wcol button[aria-selected="true"]{color:var(--a-indigo); font-weight:600}

/* ---------- discover ---------- */
.appbar{flex:none; height:56px; display:flex; align-items:center; justify-content:space-between; padding:0 16px}
.avatar{width:32px; height:32px; border-radius:50%; overflow:hidden; border:0; padding:0; background:var(--a-gray-100)}
.avatar img{width:100%; height:100%; display:block; object-fit:cover}
.htabs{display:flex; gap:28px}
.htabs button{border:0; background:none; padding:6px 2px; font-weight:600; color:var(--a-ink-3); position:relative}
.htabs button[aria-selected="true"]{color:var(--a-indigo)}
.htabs button[aria-selected="true"]::after{content:""; position:absolute; left:-10px; right:-10px; bottom:-4px; height:2px; background:var(--a-grad); border-radius:2px}
.banner img{width:100%; display:block}
.hostcta{margin:12px 16px 0; height:58px; border-radius:999px; background:var(--a-grad); color:#fff; border:0; display:flex; align-items:center; gap:12px; padding:0 18px 0 14px; width:calc(100% - 32px); text-align:left}
.hostcta .ico{width:24px; height:24px}
.hostcta .t1{font-size:12px; line-height:16px; font-weight:600}
.hostcta .t2{font-size:12px; line-height:16px; opacity:.85}
.hostcta b{margin-left:auto; font-size:14px}
.seg{margin:16px 16px 0; padding:4px; border-radius:999px; background:var(--a-indigo-100); display:grid; grid-template-columns:repeat(3,1fr)}
.seg button{height:40px; border:0; border-radius:999px; background:none; font-weight:600; font-size:13px; color:var(--a-indigo)}
.seg button[aria-selected="true"]{background:var(--a-grad); color:#fff}
.search{margin:16px 16px 0; height:48px; border:1px solid var(--a-line); border-radius:999px; display:flex; align-items:center; gap:10px; padding:0 16px; color:var(--a-ink-2); background:#fff; width:calc(100% - 32px)}
.search .ico{width:20px; height:20px}
.sec-title{display:flex; align-items:center; gap:4px; font-weight:600; color:var(--a-indigo); font-size:16px; line-height:24px; padding:20px 16px 10px}
.sec-title .ico{width:16px; height:16px}
.skel-row{display:flex; gap:10px; padding:0 16px; overflow:hidden}
.skel{border-radius:12px; background:linear-gradient(90deg,#f2f0f5 0%,#faf9fb 50%,#f2f0f5 100%); background-size:200% 100%; animation:shim 1.6s infinite linear}
@keyframes shim{to{background-position:-200% 0}}
.phase-note{margin:20px 16px; padding:14px 16px; border-radius:16px; border:1px dashed var(--a-indigo-200); background:var(--a-indigo-100); color:var(--a-indigo); display:flex; gap:10px; align-items:flex-start}
.phase-note .ico{width:20px; height:20px}
.bnav{flex:none; height:88px; border-top:1px solid var(--a-line); background:#fff; display:grid; grid-template-columns:1fr 1fr 1fr; position:relative; padding-bottom:18px}
.bnav button{border:0; background:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:14px; color:var(--a-ink-3); font-weight:500}
.bnav button .ico{width:30px; height:30px}
.bnav button[aria-current="page"]{color:var(--a-indigo); font-weight:600}
.bnav .scanbtn{position:relative}
.bnav .scanbtn .fab{position:absolute; top:-22px; left:50%; transform:translateX(-50%); width:56px; height:56px; border-radius:16px; background:var(--a-grad); color:#fff; display:grid; place-items:center}
.bnav .scanbtn .fab .ico{width:30px; height:30px}
.bnav .scanbtn span.lbl{margin-top:34px}
.menu{position:absolute; right:16px; top:104px; z-index:21; width:220px; background:#fff; border-radius:16px; border:1px solid var(--a-line); padding:6px}
.menu button{display:flex; gap:10px; align-items:center; width:100%; border:0; background:none; padding:12px; border-radius:10px; font-weight:600; text-align:left}
.menu button:active{background:var(--a-gray-100)}

/* ---------- stub ---------- */
.stub{padding:24px 16px; display:flex; flex-direction:column; gap:16px}
.stub ul{margin:0; padding-left:18px; color:var(--a-ink-2); display:grid; gap:6px}

/* ---------- panel ---------- */
.panel{flex:none; width:340px; position:sticky; top:24px; max-height:calc(100dvh - 48px); overflow-y:auto; background:var(--surface); border:1px solid var(--rule); border-radius:20px; padding:18px; display:flex; flex-direction:column; gap:18px; color:var(--text)}
.panel h1{font-size:16px; line-height:22px; margin:0; font-weight:700}
.panel .kicker{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-3); font-weight:600}
.panel .badge{display:inline-flex; align-items:center; height:22px; padding:0 8px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-size:12px; font-weight:600}
.pgroup{display:flex; flex-direction:column; gap:8px}
.pgroup h2{margin:0; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-3); font-weight:600}
.now{border:1px solid var(--rule); border-radius:14px; padding:12px; background:var(--surface-2); display:grid; gap:6px}
.now .nm{font-weight:700; font-size:15px}
.now .ref{font-size:12px; color:var(--text-2)}
.now ul{margin:2px 0 0; padding-left:16px; font-size:12.5px; line-height:18px; color:var(--text-2); display:grid; gap:3px}
.ctl{display:grid; gap:6px}
.ctl .lab{font-size:13px; font-weight:600}
.segp{display:flex; flex-wrap:wrap; gap:4px; padding:3px; border-radius:12px; background:var(--surface-2); border:1px solid var(--rule)}
.segp button{flex:1 1 auto; min-height:32px; border:0; border-radius:9px; background:none; font-size:12.5px; font-weight:600; color:var(--text-2); padding:0 8px}
.segp button[aria-pressed="true"]{background:var(--surface); color:var(--accent); box-shadow:0 0 0 1px var(--accent-line)}
.segp button:disabled{opacity:.45; cursor:not-allowed}
.pbtns{display:flex; flex-wrap:wrap; gap:6px}
.pbtn{min-height:34px; border-radius:10px; border:1px solid var(--rule); background:var(--surface); padding:0 12px; font-size:13px; font-weight:600; color:var(--text); display:inline-flex; align-items:center; gap:6px}
.pbtn .ico{width:16px; height:16px}
.pbtn:hover{border-color:var(--accent-line)}
.jump{display:grid; gap:2px}
.jump button{display:flex; justify-content:space-between; gap:8px; text-align:left; border:0; background:none; padding:7px 8px; border-radius:8px; font-size:13px; color:var(--text)}
.jump button:hover{background:var(--surface-2)}
.jump button[aria-current="true"]{background:var(--accent-soft); color:var(--accent); font-weight:600}
.jump small{color:var(--text-3); font-size:11px}
.later{font-size:12.5px; color:var(--text-2); line-height:18px}
.later b{color:var(--text)}
code.k{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; background:var(--surface-2); border:1px solid var(--rule); border-radius:6px; padding:1px 6px}
.fab-panel{display:none}
.panel .close{display:none}

@media (max-width: 820px){
  .stage{padding:0; gap:0}
  .device{width:100%; height:100dvh; min-height:0; border-radius:0; padding:0; background:transparent; box-shadow:none}
  .phone{border-radius:0}
  .home-ind{display:none}
  .panel{position:fixed; inset:auto 0 0 0; top:auto; width:auto; max-height:82dvh; border-radius:20px 20px 0 0; z-index:100; transform:translateY(105%); transition:transform .25s;
    padding-left:max(18px, env(safe-area-inset-left,0px)); padding-right:max(18px, env(safe-area-inset-right,0px)); padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  .panel.open{transform:none}
  .panel .close{display:inline-grid}
  .fab-panel{display:grid; place-items:center; position:fixed; z-index:99; right:calc(12px + env(safe-area-inset-right,0px)); top:calc(50% - 22px);
    width:44px; height:44px; border-radius:14px; border:1px solid var(--rule); background:var(--surface); color:var(--accent)}
  .fab-panel .ico{width:22px; height:22px}
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
/* ===== Phase 2 components ===== */

.pad16{padding-left:16px; padding-right:16px}

.card{border:0; background:none; padding:0; text-align:left; display:flex; flex-direction:column; gap:4px; min-width:0}

.rate{display:inline-flex; align-items:center; gap:4px; color:var(--a-ink)}

.card.more{width:120px; align-items:center; justify-content:center; height:140px; border-radius:16px; background:var(--a-indigo-100); color:var(--a-indigo); font-weight:600; gap:8px}

.hostline{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--a-ink-2); margin-top:4px; min-width:0}
.mini{width:22px; height:22px; border-radius:50%; object-fit:cover; flex:none}
.vb{display:inline-flex; width:16px; height:16px; vertical-align:-3px}
.vb svg{width:100%; height:100%}
.hb{display:inline-grid; place-items:center; width:16px; height:16px; border-radius:50%; background:var(--a-indigo); color:#fff; font-size:10px; font-weight:700; vertical-align:-2px; margin-left:3px}
.mcard{border:1px solid var(--a-line); border-radius:16px; overflow:hidden; background:#fff; padding:0; position:relative; text-align:left; display:block; width:100%}
.mcard > img{width:100%; height:150px; object-fit:cover; display:block}
.mtext{display:flex; flex-direction:column; gap:4px; padding:12px 14px 14px; font-size:13px; color:var(--a-ink-2)}

.mtext .ico{width:16px; height:16px}

.state{display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; padding:40px 32px}

.state .btn{width:auto; padding:0 24px; margin-top:8px}

/* feed */

.post{display:flex; gap:10px; padding:14px 16px; border-bottom:1px solid var(--a-line); cursor:pointer}
.pname{font-size:14px}
.ploc{display:flex; align-items:center; gap:4px; font-size:12px; color:var(--a-ink-2); margin-top:2px}

.ptext{margin:6px 0 8px; font-size:14px; line-height:20px; overflow-wrap:anywhere}
.pmedia{display:grid; gap:6px; border-radius:14px; overflow:hidden}

.snd{position:absolute; right:8px; bottom:8px; width:28px; height:28px; border-radius:50%; background:rgba(0,0,0,.5); color:#fff; display:grid; place-items:center}

.pacts{display:flex; align-items:center; gap:18px; margin-top:10px}

.bookhost{margin-left:auto; border:1.5px solid var(--a-indigo)!important; color:var(--a-indigo)!important; border-radius:999px; padding:6px 12px!important; font-weight:600; display:flex; gap:6px; align-items:center; background:#fff!important; font-size:13px}
.bookhost .ico{width:16px; height:16px}
.fab-post{position:absolute; right:16px; bottom:104px; width:56px; height:56px; border-radius:50%; border:0; background:var(--a-grad); color:#fff; display:grid; place-items:center; z-index:5; box-shadow:0 6px 18px rgba(56,22,142,.35)}

.cbar{flex:none; border-top:1px solid var(--a-line); padding:10px 16px 30px; display:flex; gap:8px; align-items:center; background:#fff}

input.cinput{color:var(--a-ink)}
.restrict{margin:0; display:flex; gap:8px; align-items:flex-start; font-size:13px; line-height:18px; color:var(--a-ink-2); background:var(--a-gray-100); border-radius:12px; padding:10px 12px; width:100%}
.restrict .ico{width:18px; height:18px; color:var(--a-ink-3)}
.restrict .link{font-size:13px}
.cblock{padding:12px 16px 4px; border-bottom:1px solid var(--a-line)}
.cm{display:flex; gap:10px; margin-bottom:8px; font-size:14px}

.vrep{border:0; background:none; color:var(--a-ink-3); font-weight:600; font-size:13px; margin:0 0 8px 46px; padding:0}
.cmedia{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px}

.cm-item button .ico{width:14px; height:14px}
.pickgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:4px}

/* detail */
.gal3{display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:0 16px}

.gal3 img{width:100%; height:100%; object-fit:cover; display:block}
.hostedby{display:flex; align-items:center; gap:6px; flex-wrap:wrap; border:0; background:none; padding:0; font-size:14px; text-align:left}
.vtag{font-size:12px; color:var(--a-info); background:var(--a-indigo-100); padding:2px 8px; border-radius:999px}
.cred{display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--a-line)}

.cred span{color:var(--a-ink-2); font-size:13px}
.notice{display:flex; gap:10px; align-items:flex-start; background:var(--a-indigo-100); color:var(--a-indigo); border-radius:12px; padding:12px; font-size:13px; line-height:18px; margin-top:14px; text-align:left}
.notice .ico{width:18px; height:18px}
.srow{display:flex; align-items:center; gap:12px; width:100%; border:1px solid var(--a-line); border-radius:16px; padding:10px; background:#fff; text-align:left}
.srow > img{width:64px; height:64px; border-radius:12px; object-fit:cover; flex:none}
.srow > img.loc{width:56px; height:56px}
.srow > span{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; font-size:14px}
.srow > .ico{width:18px; height:18px; color:var(--a-ink-3)}
.srow .price{color:var(--a-indigo); font-weight:600}
.srow .subtle{font-size:12px; line-height:16px}
.aboutcard{border:1px solid var(--a-line); border-radius:20px; padding:20px 16px; display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center}
.abav{width:96px; height:96px; border-radius:50%; overflow:hidden; border:0; padding:0; margin-bottom:8px}
.abav img{width:100%; height:100%; object-fit:cover}
.galgrid{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.galgrid button{border:0; padding:0; height:130px; border-radius:12px; overflow:hidden; background:var(--a-gray-100)}
.galgrid button.wide{grid-column:1/-1; height:180px}
.galgrid img{width:100%; height:100%; object-fit:cover}
.revcard{width:280px; border:1px solid var(--a-line); border-radius:16px; padding:14px; font-size:14px}
.rbadge{display:flex; align-items:center; gap:3px; font-weight:600; font-size:13px; background:var(--a-gray-100); border-radius:999px; padding:3px 8px}
.rbadge .ico{width:14px; height:14px; color:#f5a524}
.vetted{margin:24px 16px 0; border-radius:16px; background:var(--a-indigo-100); padding:18px 16px; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; font-size:14px}
.vetted > .ico{width:40px; height:40px}
.vetted .subtle{font-size:13px; line-height:18px; color:var(--a-ink-2)}
.cta{flex:none; padding:12px 16px 30px; border-top:1px solid var(--a-line); background:#fff}
.pill-full{display:inline-block; color:var(--a-error); background:var(--a-error-surface); border:1px solid var(--a-error-line); padding:4px 12px; border-radius:999px; font-weight:600; font-size:13px}
.timeline{display:grid; gap:14px}
.tl{display:flex; gap:12px; align-items:flex-start}
.tl img{width:72px; height:72px; border-radius:12px; object-fit:cover; flex:none}
.tl div{display:flex; flex-direction:column; gap:2px; font-size:14px}
.tl span{color:var(--a-ink-2); font-size:13px; line-height:18px}
.slot{width:200px; border:1px solid var(--a-line); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:4px; font-size:14px}
.slot.off{background:var(--a-gray-100); color:var(--a-ink-3)}
.slot.off b{color:var(--a-ink-3)}
.mapbox{position:relative; border-radius:16px; overflow:hidden; height:200px}
.mapbox img{width:100%; height:100%; object-fit:cover}
.mhero{position:relative; height:240px; flex:none; background:var(--a-gray-100)}
.mhero > img{width:100%; height:100%; object-fit:cover; display:block}
.mhero-top{position:absolute; inset:0 0 auto 0; background:linear-gradient(180deg,rgba(0,0,0,.35),transparent); padding-bottom:20px}
.mhero-top .status{color:#fff}
.glassbtn{width:40px; height:40px; border-radius:50%; border:0; background:rgba(255,255,255,.92); display:grid; place-items:center; color:var(--a-ink)}
.glassbtn .ico{width:22px; height:22px}
.chipg{font-size:12px; padding:4px 10px; border-radius:999px; background:var(--a-gray-100); color:var(--a-ink-2)}
.boxcard{border:1px solid var(--a-line); border-radius:16px; padding:14px 16px; display:flex; flex-direction:column}
.boxcard .ico{width:20px; height:20px}
.gmrev{padding:14px 0; border-bottom:1px solid var(--a-line); font-size:14px}
.starsrow{display:flex; align-items:center; gap:2px; margin-top:2px}
.starsrow .ico{width:14px; height:14px; color:var(--a-line-strong)}
.starsrow .ico.on{color:#f5a524}
.starsrow .subtle{margin-left:6px}
.rphoto{width:120px; height:90px; border-radius:10px; overflow:hidden}
.rphoto img{width:100%; height:100%; object-fit:cover}
.ckcard{display:flex; flex-direction:column; gap:8px}
.ckimg{position:relative; border:0; padding:0; border-radius:16px; overflow:hidden; aspect-ratio:3/4; background:var(--a-gray-100); display:block; width:100%}
.ckimg img{width:100%; height:100%; object-fit:cover; display:block}
.cktxt{position:absolute; left:0; right:0; bottom:0; padding:24px 10px 10px; background:linear-gradient(0deg,rgba(0,0,0,.6),transparent); color:#fff; text-align:left; font-size:13px}
.cktxt span{display:block; opacity:.9}
.ckcard .btn{gap:6px}
.ckcard .btn .ico{width:18px; height:18px}
.sumsec{padding-top:18px; padding-bottom:10px; border-bottom:1px solid var(--a-line)}
.legend{display:grid; grid-template-columns:1fr 1fr; gap:8px 12px; font-size:13px}
.legend span{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.legend i{width:10px; height:10px; border-radius:50%; flex:none}

/* search */
.recent{display:flex; align-items:center; gap:10px; width:100%; border:0; background:none; padding:10px 0; text-align:left; color:var(--a-ink); font-size:15px; border-bottom:1px solid var(--a-line)}
.recent .ico{width:20px; height:20px; color:var(--a-ink-3)}
.hrow{display:flex; align-items:center; gap:12px; width:100%; border:0; border-bottom:1px solid var(--a-line); background:none; padding:12px 0; text-align:left; font-size:14px}
.hrow b{overflow-wrap:anywhere}

/* gate */
.gatecard{border-radius:20px; background:var(--a-indigo-100); padding:24px 18px; display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center}
.gatecard.rej{background:var(--a-error-surface)}
.vbig .ico{width:64px; height:64px}
.gl{width:100%; background:#fff; border-radius:14px; padding:12px 14px; text-align:left; display:flex; flex-direction:column; gap:4px; font-size:14px; line-height:20px}
.kicker2{font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--a-info)}
.notes{width:100%; background:#fff; border-radius:14px; padding:12px 14px; text-align:left; display:flex; flex-direction:column; gap:4px; font-size:14px}

/* other profile */
.phero{position:relative; height:340px; flex:none; overflow:hidden; background:var(--a-gray-100)}
.phero > img{width:100%; height:100%; object-fit:cover; display:block}
.phero::after{content:''; position:absolute; inset:auto 0 0 0; height:180px; background:linear-gradient(0deg,rgba(0,0,0,.65),transparent); pointer-events:none}
.phero .status{color:#fff}
.pbars{position:absolute; top:52px; left:16px; right:16px; display:flex; gap:4px; z-index:2}
.pbars i{flex:1; height:3px; border-radius:2px; background:rgba(255,255,255,.45)}
.pbars i.on{background:#fff}
.pname-hero{position:absolute; left:16px; bottom:84px; color:#fff; font-size:22px; z-index:2}
.pact{position:absolute; left:16px; right:16px; bottom:16px; display:grid; grid-template-columns:repeat(4,1fr); gap:8px; z-index:2}
.pact button{height:52px; border-radius:14px; border:0; background:rgba(255,255,255,.92); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:12px; font-weight:600; color:var(--a-ink)}
.pact .ico{width:20px; height:20px}
.pact button[aria-pressed="true"]{color:var(--a-info)}
.pl{font-size:12px; color:var(--a-ink-3); font-weight:600}
.ichip{font-size:13px; padding:4px 10px; border-radius:999px; background:var(--a-indigo-100); color:var(--a-indigo)}
.iconsq{width:48px; height:48px; border-radius:12px; background:var(--a-gray-100); display:grid; place-items:center; flex:none}
.dangerrow{display:flex; align-items:center; gap:10px; border:1px solid var(--a-line); border-radius:14px; padding:14px; background:#fff; color:var(--a-error); font-weight:600; width:100%}

/* sheets */
.sharep{width:64px; border:0; background:none; padding:0; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:12px; color:var(--a-ink-2)}
.sharep img{width:52px; height:52px; border-radius:50%; object-fit:cover; border:3px solid transparent}
.sharep.on img{border-color:var(--a-info)}
.sharep.on{color:var(--a-indigo); font-weight:600}
.shareopt{border:0; background:none; display:flex; flex-direction:column; align-items:center; gap:6px; font-size:12px; color:var(--a-ink)}
.shareopt .ico{width:48px; height:48px; padding:12px; border-radius:50%; background:var(--a-gray-100)}
.radrow{display:flex; align-items:center; justify-content:space-between; gap:12px; border:0; border-bottom:1px solid var(--a-line); background:none; padding:14px 0; text-align:left; font-size:15px; width:100%}
.radrow i{width:20px; height:20px; border-radius:50%; border:2px solid var(--a-line-strong); flex:none}
.radrow i.on{border:6px solid var(--a-indigo)}
.menurow{display:flex; align-items:center; gap:12px; border:0; background:none; padding:14px 4px; font-weight:600; font-size:15px; text-align:left; width:100%; border-bottom:1px solid var(--a-line)}
.menurow:last-child{border-bottom:0}
.menurow.danger{color:var(--a-error)}

button.sec-title{border:0; background:none; width:100%; text-align:left}

/* ===== Phase 3 components ===== */
.spin.big{display:inline-block; width:40px; height:40px; border-radius:50%; border:3px solid var(--a-indigo-200); border-top-color:var(--a-indigo); animation:spin .8s linear infinite}
.toast{pointer-events:none}
.toast.push{background:rgba(32,30,36,.94); color:#fff; border-color:transparent; align-items:center}
.toast.push .subtle{color:rgba(255,255,255,.6)}
.pico{width:32px; height:32px; border-radius:8px; background:var(--a-grad); display:grid; place-items:center; flex:none}
.pico img{width:20px; height:20px; filter:brightness(10)}
.gatehero{display:grid; place-items:center; margin:16px 0 8px}
.gatehero img{width:195px; max-width:60%}
.gatehead{font-size:22px; line-height:30px; font-weight:700; color:var(--a-indigo); text-align:center; margin:4px 16px 18px; text-wrap:balance}
.rejhead{font-size:22px; line-height:30px; font-weight:800; text-align:center; margin:4px 16px 8px; color:var(--a-ink)}
.rejhead span{color:var(--a-error)}
.notesbox{display:flex; gap:10px; align-items:flex-start; background:var(--a-error-surface); border-radius:12px; padding:12px; color:var(--a-error)}
.notesbox > .ico{width:20px; height:20px}
.notesbox div{display:flex; flex-direction:column; gap:4px; font-size:13px; line-height:18px}
.notesbox b{font-size:15px}
.benefits{border:1px solid var(--a-line); border-radius:16px; padding:4px 14px}
.benefits > div{padding:12px 0; border-bottom:1px solid var(--a-line); display:flex; flex-direction:column; gap:4px; font-size:14px}
.benefits > div.row-between{flex-direction:row; align-items:center; gap:10px}
.benefits > div:last-child{border-bottom:0}
.benefits span span, .benefits > div > span{color:var(--a-ink-3); font-size:13px; line-height:18px}
.benefits > div > span > b{display:block; color:var(--a-ink); font-size:14px}
.okchip{flex:none; font-size:11px; font-weight:600; color:var(--a-indigo)!important; background:var(--a-indigo-100); padding:3px 8px; border-radius:999px}
.unl{flex:none; font-size:11px; font-weight:600; color:var(--a-success)!important; background:#e6f6ec; padding:3px 8px; border-radius:999px}
.gradtext{background:var(--a-grad); -webkit-background-clip:text; background-clip:text; color:transparent}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15); opacity:.8}}
.scanart{margin:24px 16px 0; padding:18px; border-radius:16px; background:var(--a-indigo-100); display:flex; gap:12px; align-items:center; color:var(--a-indigo)}
.scanart > .ico{width:40px; height:40px}

/* upload photos */
.kgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.kslot{position:relative; border:0; padding:0; border-radius:16px; overflow:hidden; aspect-ratio:1; background:#fff; display:block; width:100%}
.kslot.big{grid-column:1/-1; aspect-ratio:16/11}
.kslot img{width:100%; height:100%; object-fit:cover; display:block}
.kslot.empty{border:1.5px dashed var(--a-line-strong); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:var(--a-indigo); font-weight:600; font-size:14px}
.kslot.empty .ico{width:32px; height:32px; padding:6px; border-radius:50%; background:var(--a-indigo-100)}
.kchip{position:absolute; left:10px; top:10px; background:rgba(255,255,255,.9); border-radius:999px; padding:4px 10px; font-size:12px; font-weight:600}
.kstat{position:absolute; right:10px; top:10px; border-radius:999px; padding:4px 10px; font-size:12px; font-weight:600; display:flex; gap:4px; align-items:center}
.kstat .ico{width:14px; height:14px}
.kstat.pend{background:#fff2e6; color:#e07b12}
.kstat.rej{background:var(--a-error-surface); color:var(--a-error)}
.kslot:not(.big) .kstat{left:8px; right:auto; top:auto; bottom:8px}
.krep{position:absolute; inset:auto 0 0 0; background:rgba(211,37,47,.88); color:#fff; font-weight:600; font-size:13px; padding:8px; text-align:center}
.kslot:not(.big) .krep + .kstat, .kslot:not(.big) .kstat.rej{bottom:40px}

/* didit stand-in */
.didit-cam{height:260px; border-radius:20px; background:#1d1b20; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:20px; margin-top:6px}
.didit-cam.intro{background:var(--a-indigo-100); color:var(--a-indigo)}
.didit-cam.intro .ico{width:48px; height:48px}
.didit-cam p{margin:0; font-size:14px; line-height:20px; max-width:260px}
.idframe{width:220px; height:138px; border:2px dashed rgba(255,255,255,.7); border-radius:14px; display:grid; place-items:center; font-size:13px; opacity:.9; animation:pulse 1.2s ease-in-out infinite}
.faceframe{width:130px; height:170px; border:3px solid #7ee2a8; border-radius:50%; animation:pulse 1.2s ease-in-out infinite}
.dsteps{list-style:none; margin:16px 0 0; padding:0; display:grid; gap:10px}
.dsteps li{display:flex; gap:12px; align-items:flex-start; padding:12px; border:1px solid var(--a-line); border-radius:14px}
.dsteps li.now{border-color:var(--a-info); background:var(--a-indigo-100)}
.dsteps .n{width:26px; height:26px; border-radius:50%; background:var(--a-gray-100); display:grid; place-items:center; font-weight:700; font-size:13px; flex:none}
.dsteps li.done .n{background:var(--a-success); color:#fff}
.dsteps li.done .n .ico{width:16px; height:16px}
.dsteps div{display:flex; flex-direction:column; gap:2px; font-size:14px}
.dsteps span{color:var(--a-ink-2); font-size:13px}
.rejlist{margin-top:14px; border:1px solid var(--a-line); border-radius:16px; padding:0 14px}
.rejitem{border-bottom:1px solid var(--a-line)}
.rejitem:last-child{border-bottom:0}
.rejitem button{display:flex; align-items:center; gap:10px; width:100%; border:0; background:none; padding:14px 0; font-size:15px; text-align:left}
.rejitem button > .ico:first-child{width:20px; height:20px; color:var(--a-error)}
.rejitem p{margin:0 0 14px 30px; font-size:13px; line-height:18px; color:var(--a-ink-2)}
.box.dot{font-size:34px}

/* booking */
.datestrip{gap:6px; padding-top:10px}
.datestrip button{width:52px; height:74px; border:0; border-radius:16px; background:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:var(--a-ink); position:relative}
.datestrip b{font-size:20px}
.datestrip span{font-size:12px; color:var(--a-ink-2)}
.datestrip button[aria-selected="true"]{background:var(--a-indigo-100); color:var(--a-indigo)}
.datestrip button[aria-selected="true"] span{color:var(--a-indigo)}
.datestrip i{position:absolute; bottom:8px; width:5px; height:5px; border-radius:50%; background:var(--a-indigo)}
.schsvc{padding:14px 16px; border-bottom:1px solid var(--a-line)}
.schsvc .price{display:block; font-weight:700; font-size:14px; margin-top:2px}
.thumb64{width:64px; height:64px; border-radius:12px; object-fit:cover; flex:none}
.thumb56{width:56px; height:56px; border-radius:10px; object-fit:cover; flex:none}
.thumb80{width:80px; height:80px; border-radius:12px; object-fit:cover; flex:none}
.slots{gap:8px}
.slot2{height:38px; padding:0 12px; border-radius:8px; border:1px solid var(--a-line); background:#fff; font-size:13px; font-weight:600; color:var(--a-ink)}
.slot2.sel{border-color:var(--a-indigo); color:var(--a-indigo); background:var(--a-indigo-100)}
.slot2[disabled]{background:var(--a-gray-100); color:var(--a-ink-3); border-color:transparent}
.stepper{display:inline-flex; align-items:center; gap:10px}
.stepper button{width:26px; height:26px; border-radius:6px; border:1px solid var(--a-line-strong); background:#fff; color:var(--a-indigo); font-size:16px; line-height:1; display:grid; place-items:center; padding:0}
.stepper button[disabled]{color:var(--a-line-strong); border-color:var(--a-line)}
.stepper > span{display:flex; flex-direction:column; align-items:center; min-width:34px; font-size:16px}
.stepper small{font-size:11px; color:var(--a-ink-2)}
.stepper.compact{gap:6px}
.stepper.compact > span{flex-direction:row; gap:3px; font-size:12px; border:1px solid var(--a-line); border-radius:6px; padding:3px 8px; white-space:nowrap}
.stepper.compact > span b{font-size:12px}
.stepper.compact button{width:22px; height:22px; font-size:14px}
.expslot{display:flex; flex-direction:column; gap:6px; text-align:left; border:1px solid var(--a-line); border-radius:14px; padding:14px; background:#fff; font-size:15px; width:100%}
.expslot b + b{font-size:16px}
.expslot > span{align-self:flex-end; font-size:12px; font-weight:600; color:var(--a-indigo)}
.expslot > span.bad{color:var(--a-error)}
.expslot.sel{border-color:var(--a-indigo); box-shadow:0 0 0 1px var(--a-indigo)}
.expslot[disabled]{background:var(--a-gray-100); color:var(--a-ink-3); border-color:transparent}
.paybar{display:flex; align-items:center; gap:16px}
.paybar > div{flex:none; display:flex; flex-direction:column}
.paybar > div b{color:var(--a-indigo); font-size:18px}
.paybar .btn{flex:1}
.hr{height:1px; background:var(--a-line)}
.pmeth{display:flex; align-items:center; justify-content:space-between; gap:12px; border:1px solid var(--a-line); border-radius:14px; padding:12px 14px; background:#fff; text-align:left; width:100%; font-size:14px}
.pmeth > i{width:20px; height:20px; border-radius:50%; border:2px solid var(--a-line-strong); flex:none}
.pmeth.on{border-color:var(--a-indigo); box-shadow:0 0 0 1px var(--a-indigo)}
.pmeth.on > i{border:6px solid var(--a-indigo)}
.pmeth[aria-disabled="true"]{background:var(--a-gray-100)}
.pmeth[aria-disabled="true"] > i{opacity:.4}
.balamt{font-size:20px}
.brands{display:flex; flex-wrap:wrap; gap:4px}
.brands i{font-style:normal; font-size:10px; font-weight:700; border:1px solid var(--a-line); border-radius:4px; padding:2px 5px; color:var(--a-ink-2); background:#fff}
.kv{display:flex; justify-content:space-between; gap:12px; padding:6px 0; font-size:14px; color:var(--a-ink-2)}

.bz-chip{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px; background:#fff}

.bz-chip.ok{color:#137a3b} .bz-chip.ok i{background:#22b357}
.bz-chip.warn{color:#b15c00} .bz-chip.warn i{background:#f29a1f}
.bz-chip.err{color:#b4202a} .bz-chip.err i{background:#e0343f}
.bz-amt{display:flex; flex-direction:column}
.bz-amt b{font-size:36px; line-height:42px; letter-spacing:-.6px; font-variant-numeric:tabular-nums}
.bz-amt span{font-size:13px; opacity:.85}
.bz-bar{height:8px; border-radius:999px; background:rgba(255,255,255,.22); overflow:hidden}
.bz-bar i{display:block; height:100%; border-radius:999px; background:#fff}
.bz-float.low .bz-bar i{background:linear-gradient(90deg,#ffd08a,#ffb347)}
.bz-meta{display:flex; flex-direction:column; gap:4px; font-size:12px; line-height:16px; opacity:.92}
.bz-meta span{display:flex; align-items:center; gap:6px}
.bz-meta .ico{width:14px; height:14px; flex:none}
.bz-fbtns{display:grid; grid-template-columns:1fr auto; gap:8px; margin-top:2px}
.bz-btn-w{height:44px; border:0; border-radius:999px; background:#fff; color:var(--a-indigo); font:inherit; font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:6px}
.bz-btn-w .ico{width:18px; height:18px}
.bz-float.low .bz-btn-w, .bz-float.paused .bz-btn-w{box-shadow:0 0 0 4px rgba(255,255,255,.25)}
.bz-btn-g{height:44px; padding:0 18px; border:1px solid rgba(255,255,255,.45); border-radius:999px; background:rgba(255,255,255,.08); color:#fff; font:inherit; font-size:14px; font-weight:600}
.bz-alert{display:flex; gap:10px; align-items:flex-start; border-radius:14px; padding:12px 14px; margin-bottom:12px; font-size:13px; line-height:18px}
.bz-alert.err{background:var(--a-error-surface); color:#8e1820; border:1px solid var(--a-error-line)}
.bz-alert .ico{width:20px; height:20px; flex:none; color:var(--a-error)}
.bz-alert b{display:block; font-size:14px; color:var(--a-error)}
/* quick actions */
.bz-qa{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px}
.bz-qa-i{display:flex; flex-direction:column; align-items:flex-start; gap:2px; padding:12px; border-radius:18px; border:1px solid #ece6f8; background:#fff; text-align:left; font-family:inherit; color:var(--a-ink); box-shadow:0 4px 12px -10px rgba(56,22,142,.4)}
.bz-qa-i > span{width:40px; height:40px; border-radius:12px; display:grid; place-items:center; margin-bottom:8px}
.bz-qa-i > span .ico{width:22px; height:22px}
.bz-qa-i .q1{background:var(--a-grad); color:#fff}
.bz-qa-i .q2{background:#fdeef6; color:#b23d82}
.bz-qa-i .q3{background:#e9f6ef; color:#1f8a4c}
.bz-qa-i b{font-size:14px; line-height:20px}
.bz-qa-i small{font-size:11px; line-height:14px; color:var(--a-ink-3)}
/* today */
.bz-today{margin-top:14px; border-radius:18px; background:#fff; border:1px solid #ece6f8; padding:14px}
.bz-stats{display:grid; grid-template-columns:repeat(3,1fr); margin-top:10px}
.bz-stats div{display:flex; flex-direction:column; gap:1px; padding:0 10px; border-left:1px solid var(--a-line)}
.bz-stats div:first-child{padding-left:0; border-left:0}
.bz-stats small{font-size:11px; color:var(--a-ink-3)}
.bz-stats b{font-size:17px; line-height:22px; font-variant-numeric:tabular-nums}
.bz-stats em{font-style:normal; font-size:11px; color:var(--a-ink-3)}
.bz-stats em.up{color:var(--a-success); font-weight:600}
/* voucher tickets */
.bz-strip{display:flex; gap:10px; overflow-x:auto; padding:10px 16px 4px; scrollbar-width:none; scroll-snap-type:x mandatory}
.bz-strip::-webkit-scrollbar{display:none}
.bz-tk{flex:none; width:268px; display:grid; grid-template-columns:86px 1fr; border-radius:16px; overflow:hidden; scroll-snap-align:start; background:#fff; border:1px solid #ece6f8; position:relative}
.bz-tk::before, .bz-tk::after{content:""; position:absolute; left:79px; width:14px; height:14px; border-radius:50%; background:#fff; border:1px solid #ece6f8}
.bz-tk::before{top:-8px} .bz-tk::after{bottom:-8px}
.bz-tk-l{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:14px 6px; color:#fff; background:linear-gradient(160deg,#c65a8f,#6b3fb5); border-right:2px dashed rgba(255,255,255,.55)}
.bz-tk.soon .bz-tk-l{background:linear-gradient(160deg,#a77bc8,#38168e)}
.bz-tk.off .bz-tk-l{background:linear-gradient(160deg,#b3afc4,#6f6b85)}
.bz-tk-l b{font-size:22px; line-height:26px}
.bz-tk-l small{font-size:10px; opacity:.9; text-align:center; line-height:12px}
.bz-tk-r{display:flex; flex-direction:column; align-items:flex-start; gap:4px; padding:12px 14px 12px 16px}
.bz-tk-code{font-weight:800; font-size:15px; letter-spacing:.6px}
.bz-tk-r small{font-size:12px; color:var(--a-ink-3)}
.bz-pill{font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px}
.bz-pill.on{background:#e6f6ec; color:#137a3b} .bz-pill.soon{background:var(--a-indigo-100); color:var(--a-indigo)} .bz-pill.off{background:var(--a-gray-100); color:var(--a-ink-3)}
.bz-tk.add{width:150px; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:2px; padding:14px; border:1.5px dashed var(--a-indigo-200); background:#fbf9ff; font-family:inherit; color:var(--a-indigo); text-align:left}
.bz-tk.add::before,.bz-tk.add::after{display:none}
.bz-tk.add .ico{width:24px; height:24px; padding:4px; border-radius:50%; background:var(--a-indigo); color:#fff; margin-bottom:6px}
.bz-tk.add b{font-size:14px} .bz-tk.add small{font-size:11px; color:var(--a-ink-3); line-height:14px}
/* host */
.bz-host{margin-top:10px; border-radius:18px; background:#fff; border:1px solid #ece6f8; padding:14px; display:flex; flex-direction:column; gap:10px}
.bz-hn{flex:1; min-width:0; display:flex; flex-direction:column}
.bz-hn b{font-size:15px} .bz-hn small{font-size:12px; color:var(--a-ink-3); line-height:16px}
.bz-hs{margin:0; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--a-ink-2); padding:8px 10px; border-radius:10px; background:#f7f5fb}
.bz-hs .dot{width:8px; height:8px; border-radius:50%; background:var(--a-line-strong); flex:none}
.bz-hs .dot.on{background:#22b357; box-shadow:0 0 0 3px #d9f3e3}
.bz-hrow{display:flex; align-items:center; gap:10px; width:100%; border:0; border-top:1px solid var(--a-line); background:none; padding:12px 0 0; font-family:inherit; font-size:14px; font-weight:600; color:var(--a-ink)}
.bz-hrow span:not(.ico){flex:1; text-align:left}
.bz-hrow .ico{width:20px; height:20px; color:var(--a-ink-2)}
/* top up */
.bz-amts{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.bz-amts.four{grid-template-columns:repeat(4,1fr)}
.bz-amts button{display:flex; flex-direction:column; align-items:center; gap:2px; padding:12px 6px; border-radius:14px; border:1.5px solid var(--a-line); background:#fff; font-family:inherit; color:var(--a-ink)}
.bz-amts button b{font-size:16px} .bz-amts button small{font-size:11px; color:var(--a-ink-3)}
.bz-amts button.on{border-color:var(--a-indigo); background:var(--a-indigo-100); color:var(--a-indigo)}
/* QR */
.bz-qrs{background:linear-gradient(180deg,#efe8fc 0%,#f7f5fb 40%,#fff 100%)}
.bz-qrs .topbar{background:transparent}
.bz-qrcard{background:#fff; border-radius:28px; padding:20px 18px; display:flex; flex-direction:column; align-items:center; gap:14px; box-shadow:0 24px 40px -28px rgba(56,22,142,.6), 0 0 0 1px #ece6f8}
.bz-qrhead{display:flex; align-items:center; gap:12px; align-self:stretch}
.bz-qrhead > span:not(.bz-av){display:flex; flex-direction:column} .bz-qrhead b{font-size:16px} .bz-qrhead small{font-size:12px; color:var(--a-ink-3)}
.bz-qrbox{position:relative; width:250px; height:250px; padding:14px; border-radius:22px; background:#fff; box-shadow:inset 0 0 0 1.5px var(--a-indigo-200)}
.bz-qrbox svg{width:100%; height:100%; display:block}
.bz-qrlogo{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:44px; height:44px; border-radius:12px; background:var(--a-grad); color:#fff; display:grid; place-items:center; border:4px solid #fff}
.bz-qrlogo .ico{width:20px; height:20px}
.bz-qrcb{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:#8a2f68; background:#fdeef6; padding:8px 12px; border-radius:999px}
.bz-qrcb span{display:grid} .bz-qrcb .ico{width:16px; height:16px}
.bz-copy{display:flex; align-items:center; gap:6px; border:0; background:none; font-family:inherit; font-size:13px; font-weight:600; color:var(--a-ink-2)}
.bz-copy .ico{width:16px; height:16px}
.bz-amtbtn{display:flex; align-items:center; gap:12px; width:100%; border:1px solid #ece6f8; background:#fff; border-radius:16px; padding:12px 14px; text-align:left; font-family:inherit; color:var(--a-ink)}
.bz-amtbtn > .ico:first-child{width:32px; height:32px; padding:6px; border-radius:10px; background:var(--a-indigo-100); color:var(--a-indigo)}
.bz-amtbtn span:not(.ico){flex:1; display:flex; flex-direction:column} .bz-amtbtn small{font-size:12px; color:var(--a-ink-3)}
.bz-amtbtn > .ico:last-child{width:18px; height:18px; color:var(--a-ink-2)}
.bz-tip{margin:0; display:flex; gap:8px; align-items:center; justify-content:center; font-size:12px; color:var(--a-ink-3)}
.bz-tip .ico{width:16px; height:16px}
.w2foot .btn .ico{width:20px; height:20px; margin-right:6px; vertical-align:-4px}
.w2foot[style*="row"] .btn{flex:1}
/* vouchers page */
.bz-explain{display:flex; gap:10px; align-items:flex-start; font-size:13px; line-height:18px; color:var(--a-ink-2); background:#fff; border:1px solid #ece6f8; border-radius:14px; padding:12px}
.bz-explain .ico{width:18px; height:18px; color:var(--a-indigo); flex:none}
.bz .bz-vd{background:#fff; border:1px solid #ece6f8; border-radius:16px; padding:8px 14px 12px; margin-top:-6px}
.bz-vact{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px}
.bz-vact button{height:40px; border-radius:12px; border:1px solid var(--a-line); background:#fff; font-family:inherit; font-size:13px; font-weight:600; color:var(--a-ink); display:flex; align-items:center; justify-content:center; gap:6px}
.bz-vact .ico{width:16px; height:16px}
.bz-vact .end{color:var(--a-error); border-color:var(--a-error-line)}
.bz .bz-tk{width:100%}
.bz-strip .bz-tk{width:268px}
.bz-strip .bz-tk.add{width:150px}
.bz-2{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px}
.bz-2 .field label{white-space:nowrap}
.bz-sel{display:flex; align-items:center; gap:8px; text-align:left; font-family:inherit; color:var(--a-ink); height:52px}
.bz-sel .ico{width:18px; height:18px; color:var(--a-ink-2)}
/* host settings */
.bz-hhero{display:flex; align-items:center; gap:12px; background:#fff; border:1px solid #ece6f8; border-radius:18px; padding:14px}
.bz-hhero > span:not(.bz-av){flex:1; display:flex; flex-direction:column} .bz-hhero b{font-size:17px} .bz-hhero small{font-size:12px; color:var(--a-ink-3)}
.bz-card{background:#fff; border:1px solid #ece6f8; border-radius:18px; padding:14px}
.bz-chips{display:flex; flex-wrap:wrap; gap:8px}
.bz-chips > *{font-family:inherit; cursor:pointer; display:inline-flex; align-items:center; gap:4px; height:34px; padding:0 12px; border-radius:999px; border:1px solid var(--a-line); background:#fff; font-size:13px; font-weight:600; color:var(--a-ink-2)}
.bz-chips > .on{border-color:var(--a-indigo); background:var(--a-indigo-100); color:var(--a-indigo)}
.bz-chips .ico{width:14px; height:14px}
.bz-list{background:#fff; border:1px solid #ece6f8; border-radius:18px; padding:2px 14px}
.bz-list button{display:flex; align-items:center; gap:12px; width:100%; border:0; border-bottom:1px solid var(--a-line); background:none; padding:12px 0; text-align:left; font-family:inherit; color:var(--a-ink)}
.bz-list button:last-child{border-bottom:0}
.bz-list button > .ico:first-child{width:36px; height:36px; padding:8px; border-radius:11px; background:var(--a-indigo-100); color:var(--a-indigo)}
.bz-list span:not(.ico){flex:1; display:flex; flex-direction:column; font-size:14px} .bz-list small{font-size:12px; color:var(--a-ink-3)}
.bz-list button > .ico:last-child{width:18px; height:18px; color:var(--a-ink-3)}
.bz-stop{border:0; background:none; font-family:inherit; font-size:14px; font-weight:600; color:var(--a-error); padding:8px; align-self:center}
/* empty */
.bz-empty{display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; padding:22px 18px; border-radius:24px; background:linear-gradient(170deg,#ffffff,#f3edfd); border:1px solid #ece6f8}
.bz-emptyart{width:72px; height:72px; border-radius:22px; display:grid; place-items:center; background:var(--a-grad); color:#fff; box-shadow:0 14px 24px -14px rgba(56,22,142,.8)}
.bz-emptyart .ico{width:36px; height:36px}
.bz-empty > b{font-size:20px; line-height:26px}
.bz-empty p{margin:0; font-size:14px; line-height:20px; color:var(--a-ink-2)}
.bz-empty ul{list-style:none; margin:4px 0 6px; padding:0; display:flex; flex-direction:column; gap:8px; align-self:stretch}
.bz-empty li{display:flex; align-items:center; gap:10px; font-size:14px; font-weight:600; background:#fff; border:1px solid #ece6f8; border-radius:12px; padding:10px 12px; text-align:left}
.bz-empty li .ico{width:20px; height:20px; color:var(--a-indigo)}
.bz-empty .btn{align-self:stretch}
.bz-empty > small{font-size:12px; color:var(--a-ink-3)}

.bz-meta button{display:flex; align-items:center; gap:6px; background:none; border:0; color:inherit; font:inherit; padding:0; text-align:left; cursor:pointer}
.bz-meta button .ico:last-child{width:12px; height:12px; opacity:.8}
.bz-host{cursor:pointer; margin-top:0}
.bz-host:active{background:#fbf9ff}
.bz-hs span{flex:1}
.bz-hs b{display:flex; align-items:center; gap:2px; color:var(--a-indigo); font-size:12px; white-space:nowrap}
.bz-hs b .ico{width:14px; height:14px}
.bz-qrcb.off{background:var(--a-gray-100); color:var(--a-ink-2)}
.bz-vact.one{grid-template-columns:1fr}
.bz-sec .bz-h{margin-bottom:0}
.pad16.bz-sec + .bz-id{padding-top:10px}
.bz-tk[role="button"]{cursor:pointer}
.w2foot[style*="row"] .btn{white-space:nowrap}
/* ---- referral + rewards (3.1) ---- */
.rf-row{display:flex; align-items:center; justify-content:space-between; gap:10px}
.rf-col{flex:1; min-width:0; display:flex; flex-direction:column}
.rf-col small{font-size:12px; line-height:16px; color:var(--a-ink-3)}
.rf-hero{position:relative; overflow:hidden; display:flex; align-items:center; gap:12px; padding:18px 16px 22px; color:#fff;
  background:radial-gradient(circle at 85% 20%, rgba(255,255,255,.14) 0 16%, transparent 17%), linear-gradient(120deg,#a77bc8 0%,#6b3fb5 55%,#38168e 100%)}
.rf-hero > img:not(.rf-gift){width:52px; height:52px; border-radius:50%; object-fit:cover; border:2px solid rgba(255,255,255,.7); flex:none; position:relative; z-index:1}
.rf-hero .rf-col{position:relative; z-index:1}
.rf-hero .rf-col b{display:flex; align-items:center; gap:4px; font-size:17px}
.rf-hero .rf-col b .ico{width:16px; height:16px}
.rf-hero .rf-col small{color:rgba(255,255,255,.85)}
.rf-gift{position:absolute; right:-18px; bottom:-30px; width:150px; opacity:.55; pointer-events:none}
.rf-tags{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap}
.rf-tag{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; background:rgba(255,255,255,.22); color:#fff}
.rf-tag.sh{background:#fff; color:var(--a-indigo)}
.rf-tag .ico{width:12px; height:12px}
.rf-by{display:flex; align-items:center; gap:12px; background:#fff; border:1px solid #ece6f8; border-radius:16px; padding:12px 14px; box-shadow:0 10px 24px -18px rgba(56,22,142,.6)}
.rf-by > .ico{width:36px; height:36px; padding:8px; border-radius:11px; background:var(--a-indigo-100); color:var(--a-indigo); flex:none}
.rf-by b{font-size:14px}
.rf-code{font-weight:800; letter-spacing:.6px; color:var(--a-indigo); font-size:13px}
.rf-linkbtn{flex:none; height:34px; padding:0 14px; border:0; border-radius:999px; background:var(--a-grad); color:#fff; font:inherit; font-size:13px; font-weight:700; cursor:pointer}
.rf-qr{display:flex; flex-direction:column; align-items:center; gap:6px; border:1px solid #ece6f8; border-radius:18px; padding:16px; background:#fff}
.rf-qr > small{font-size:12px; color:var(--a-ink-3); margin-top:4px}
.rf-mycode{font-size:22px; letter-spacing:2px; color:var(--a-indigo); margin-bottom:6px}
.rf-sh{border-radius:18px; padding:14px; background:linear-gradient(160deg,#fff 0%,#f6f1fd 100%); border:1px solid #e4dcfa; display:flex; flex-direction:column; gap:12px}
.rf-shic{width:36px; height:36px; border-radius:11px; display:grid; place-items:center; background:var(--a-grad); color:#fff; flex:none}
.rf-shic .ico{width:18px; height:18px}
.rf-sh .rf-row{justify-content:flex-start}
.rf-sh b{font-size:14px}
.rf-bar{display:flex; flex-direction:column; gap:6px; font-size:12px; color:var(--a-ink-2)}
.rf-bar .rf-row{justify-content:space-between}
.rf-bar b{color:var(--a-ink); font-size:12px}
.rf-note{margin:0; display:flex; gap:6px; align-items:flex-start; font-size:12px; line-height:17px; color:var(--a-ink-3)}
.rf-note .ico{width:14px; height:14px; flex:none; margin-top:1px}
.rf-sub{display:flex; justify-content:space-between; align-items:baseline; padding:8px 0 2px}
.rf-sub b{font-size:15px} .rf-sub small{font-size:12px; color:var(--a-ink-3)}
.rf-fr{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--a-line)}
.rf-fr img{width:38px; height:38px; border-radius:50%; object-fit:cover; flex:none}
.rf-fr b{font-size:14px}
.rf-st{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; background:#fff4e5; color:#b15c00; white-space:nowrap}
.rf-st.ok{background:#e6f6ec; color:#137a3b}
.rf-st .ico{width:12px; height:12px}
.rf-vol{border-radius:18px; padding:16px; color:#fff; background:linear-gradient(135deg,#a77bc8,#38168e); display:flex; flex-direction:column; gap:2px; margin:8px 0 12px}
.rf-vol small{font-size:12px; opacity:.85} .rf-vol b{font-size:30px; line-height:36px} .rf-vol > span{font-size:12px; opacity:.85}
.rf-bars{display:flex; align-items:flex-end; gap:16px; height:70px; margin-top:12px}
.rf-bars div{flex:1; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:4px}
.rf-bars i{width:100%; border-radius:8px 8px 3px 3px; background:rgba(255,255,255,.75)}
.rf-bars small{font-size:11px}
/* rewards */
.rw-card{border-radius:22px; padding:16px; color:#fff; display:flex; flex-direction:column; gap:4px; background:radial-gradient(circle at 88% 10%, rgba(255,255,255,.16) 0 20%, transparent 21%), linear-gradient(135deg,#a77bc8 0%,#6b3fb5 55%,#38168e 100%); box-shadow:0 16px 30px -20px rgba(56,22,142,.8)}
.rw-card .rf-row small{font-size:13px; opacity:.9}
.rw-card .rf-tags{margin:0}
.rw-card > b{font-size:32px; line-height:40px; font-variant-numeric:tabular-nums}
.rw-card .btn{margin-top:8px; height:44px; background:#fff; color:var(--a-indigo); font-size:15px}
.rw-card .btn[aria-disabled="true"]{background:rgba(255,255,255,.5)}
.rw-cap{text-align:center; font-size:12px; opacity:.9; margin-top:4px}
.rw-rate{display:flex; gap:8px; align-items:flex-start; margin:12px 0 0; font-size:13px; line-height:18px; color:var(--a-ink-2)}
.rw-rate .ico{width:16px; height:16px; color:var(--a-indigo); flex:none; margin-top:1px}

.pc-save{margin:0; display:flex; gap:8px; align-items:flex-start; padding:10px 12px; border-radius:14px; background:#fff; color:var(--a-ink); font-size:12px; line-height:16px}

.pl-how{margin-top:18px; display:flex; flex-direction:column; gap:0}
