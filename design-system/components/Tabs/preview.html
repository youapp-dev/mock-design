<!doctype html>
<html><head>

<body><div id="root"></div>
<script>
  var Y = window.YouApp, h = React.createElement;
  var C = "../../assets/Icons/check-circle.svg";
  ReactDOM.createRoot(document.getElementById("root")).render(h(React.Fragment, null,
    h(Y.Tabs, { items: [{ value: "upcoming", label: "Upcoming" }, { value: "past", label: "Past" }] }),
    h(Y.SegmentedControl, { ariaLabel: "Role", items: [{ value: "buyer", label: "Buyer", icon: C }, { value: "host", label: "Host", icon: C }] })
  ));
