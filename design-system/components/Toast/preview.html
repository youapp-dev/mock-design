<!-- @dsCard group="Feedback" height=330 subtitle="Success, Failed, Pending, neutral confirmation, failed with action" -->
<!doctype html>
<html><head>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="../bundle.js"></script>
<meta charset="utf-8"><title>Toast</title>
<style>body{margin:0;padding:16px;background:var(--brand-white)}#root{display:flex;flex-direction:column;gap:12px;max-width:380px}</style></head>
<body><div id="root"></div>
<script>
  var Y = window.YouApp, h = React.createElement;
  var OK = "../../assets/Icons/check-circle-fill.svg", ERR = "../../assets/Icons/close-circle-fill.svg", PEND = "../../assets/Icons/clock-fill.svg", X = "../../assets/Icons/close.svg";
  var noop = function () {};
  ReactDOM.createRoot(document.getElementById("root")).render(h(React.Fragment, null,
    h(Y.Toast, { tone: "success", icon: OK, closeIcon: X, onClose: noop }, "Payment sent"),
    h(Y.Toast, { tone: "failed", icon: ERR, closeIcon: X, onClose: noop }, "Payment failed"),
    h(Y.Toast, { tone: "pending", icon: PEND, closeIcon: X, onClose: noop }, "Waiting for confirmation"),
    h(Y.Toast, { tone: "neutral" }, "Report has been sent"),
    h(Y.Toast, { tone: "failed", icon: ERR, actionLabel: "Report", onAction: noop }, "We couldn't load your schedule. Tell us what happened so we can fix it.")
  ));
</script></body></html>
